<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEBY — SF Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --red:#B01021; --red-deep:#7E0B18; --red-ink:#FFFFFF; --red-soft:#FCE5E8; --red-line:#F0C9CE;
  --bg:#F2EDEA; --surface:#FFFFFF; --surface-2:#FAF5F2; --surface-3:#F0E9E5;
  --ink:#12100F; --ink-dim:#6B6260; --ink-faint:#9A918E;
  --border:#E3DAD5; --border-strong:#D2C6C0;
  --good:#1E8E5A; --good-soft:#DFF3E7;
  --warn:#B5650A; --warn-soft:#F8EBD8;
  --bad:#9F1239; --bad-soft:#FBE3EA;
  --shadow:0 1px 2px rgba(18,16,15,.05), 0 10px 28px -14px rgba(18,16,15,.22);
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance;}
button{font-family:inherit;}
a{color:var(--red);}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.lbl{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);}

/* ---------- shell ---------- */
#app{min-height:100vh;}
.wrap-mobile{max-width:480px;margin:0 auto;background:var(--surface-2);min-height:100vh;box-shadow:var(--shadow);padding-bottom:78px;}
.wrap-plain{max-width:480px;margin:0 auto;padding:0 0 40px;}
.topbar{background:var(--red);color:var(--red-ink);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;}
.topbar .brand{display:flex;align-items:baseline;gap:8px;}
.topbar .brand b{font-size:17px;font-weight:800;letter-spacing:-.01em;}
.topbar .brand span{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;opacity:.8;text-transform:uppercase;}
.topbar .tb-act{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;}
.topbar .tb-act:hover{background:rgba(255,255,255,.26);}
.hero{background:var(--red);color:var(--red-ink);padding:6px 18px 26px;}
.hero .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.82;}
.hero h1{font-size:25px;margin:6px 0 4px;}
.hero p{margin:0;font-size:13.5px;opacity:.86;}
.pad{padding:18px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.row{display:flex;gap:10px;align-items:center;}
.grow{flex:1;min-width:0;}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;}
.card.flat{box-shadow:none;}
.card.lift{box-shadow:var(--shadow);}
.card-title{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 10px;}
.sec-head h2{font-size:17px;}
.sec-head .link{font-size:12.5px;color:var(--red);cursor:pointer;background:none;border:none;padding:0;font-weight:600;}

/* ---------- stat ---------- */
.stat-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.stat .n{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em;}
.stat .n.red{color:var(--red);}
.stat .k{margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:14.5px;padding:12px 18px;cursor:pointer;transition:filter .15s;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:not(:disabled):hover{filter:brightness(1.06);}
.btn-primary{background:var(--red);color:var(--red-ink);}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--ink);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-danger{background:var(--bad-soft);color:var(--bad);}
.btn-ok{background:var(--good-soft);color:var(--good);}
.btn-block{width:100%;}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:9px;}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:6px;}
.field + .field{margin-top:13px;}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);}
.field input,.field select,.field textarea{
  font-family:inherit;font-size:15px;padding:11px 13px;border-radius:10px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);width:100%;
}
.field input:disabled,.field select:disabled{background:var(--surface-3);color:var(--ink-dim);}
.field textarea{font-family:"IBM Plex Mono",monospace;font-size:13px;line-height:1.5;resize:vertical;}
.field .hint{font-size:11.5px;color:var(--ink-dim);}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.req::after{content:" *";color:var(--red);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;min-width:92px;padding:11px 8px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-dim);font-weight:700;font-size:13.5px;cursor:pointer;}
.seg button.on{background:var(--red);border-color:var(--red);color:var(--red-ink);}
.chips{display:flex;gap:7px;flex-wrap:wrap;}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-dim);font-size:12.5px;font-weight:600;cursor:pointer;}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;}
.pill-red{background:var(--red-soft);color:var(--red);}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warn{background:var(--warn-soft);color:var(--warn);}
.pill-bad{background:var(--bad-soft);color:var(--bad);}
.pill-neutral{background:var(--surface-3);color:var(--ink-dim);}
.grp{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;}
.grp-ds{background:var(--red-soft);color:var(--red);}
.grp-ypcr{background:#E6EAF7;color:#3A4E8C;}
.grp-bud{background:#F6E7D6;color:#8A5418;}
.grp-lain{background:#E8E4F3;color:#4B3A8A;}

/* ---------- task item ---------- */
.task{border:1px solid var(--border);border-radius:13px;padding:14px;background:var(--surface);}
.task + .task{margin-top:10px;}
.task .t-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.task .t-name{font-weight:700;font-size:15px;}
.task .t-sub{font-size:12.5px;color:var(--ink-dim);margin-bottom:12px;}

/* ---------- leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
.lb-row:last-child{border-bottom:none;}
.lb-row.me{background:var(--red-soft);border-radius:11px;padding:11px 12px;border-bottom:none;}
.lb-rank{width:32px;height:32px;border-radius:9px;background:var(--surface-3);color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;flex:none;}
.lb-rank.r1{background:var(--red);color:#fff;}
.lb-rank.r2{background:#C4626F;color:#fff;}
.lb-rank.r3{background:#D79AA3;color:#fff;}
.lb-name{font-weight:700;font-size:14px;}
.lb-sub{font-size:11.5px;color:var(--ink-dim);}
.lb-pts{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px;}

/* ---------- photo ---------- */
.photo-tile{border:1.5px dashed var(--border-strong);border-radius:13px;aspect-ratio:3/4;max-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink-dim);background:var(--surface-3);overflow:hidden;position:relative;}
.photo-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-tile .retake{position:absolute;bottom:10px;right:10px;background:rgba(18,16,15,.75);color:#fff;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:8px;}
.photo-tile .ph-ico{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;}
.photo-tile span.cap{font-size:12.5px;font-weight:600;}
.gate-dark{background:var(--ink);color:#fff;border-radius:16px;padding:20px;}
.gate-dark h2{color:#fff;font-size:21px;margin-bottom:6px;}
.gate-dark p{color:rgba(255,255,255,.72);font-size:13px;margin:0 0 16px;}
.gate-dark .photo-tile{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);}
.gate-meta{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12.5px;}
.gate-meta .k{color:rgba(255,255,255,.6);}
.gate-meta .v{font-family:"IBM Plex Mono",monospace;font-weight:600;}

/* ---------- quiz ---------- */
.q-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.q-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
.bar > i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .25s;}
.q-text{font-weight:700;font-size:16px;margin:14px 0 12px;}
.opt{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;background:var(--surface);}
.opt + .opt{margin-top:9px;}
.opt:has(input:checked){border-color:var(--red);background:var(--red-soft);}
.opt input{margin-top:3px;accent-color:var(--red);flex:none;}
.opt .ot{font-size:14.5px;}
.rev{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);}
.rev:last-child{border-bottom:none;}
.rev .mk{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;color:#fff;}
.rev .mk.y{background:var(--good);}
.rev .mk.n{background:var(--bad);}
.rev .rt{font-weight:600;font-size:13.5px;}
.rev .rs{font-size:12px;color:var(--ink-dim);}
.rev .rp{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;}
.bnav button{background:none;border:none;padding:10px 4px 12px;cursor:pointer;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;}
.bnav button.on{color:var(--red);}
.bnav .bi{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.06em;}
.bnav .bt{font-size:10.5px;font-weight:600;}

/* ---------- menu grid ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.mgrid button{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.mgrid .mi{width:32px;height:32px;border-radius:9px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;}
.mgrid .mt{font-size:11px;font-weight:600;color:var(--ink-dim);text-align:center;line-height:1.25;}

/* ---------- knowledge ---------- */
.kn{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit;cursor:pointer;}
.kn + .kn{margin-top:9px;}
.kn .kt{width:38px;height:38px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;flex:none;}
.kn .kt.t-KV{background:#B5545C;} .kn .kt.t-PDF{background:#7A6F6C;} .kn .kt.t-VID{background:#6B7FA8;} .kn .kt.t-DOC{background:#8A7AA8;} .kn .kt.t-FAQ{background:#6F8F7A;}
.kn .kn-n{font-weight:700;font-size:14px;display:block;}
.kn .kn-s{font-size:12px;color:var(--ink-faint);display:block;margin-top:2px;}
.kn .ka{margin-left:auto;color:var(--ink-faint);font-size:16px;}
.kn .kdot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-left:auto;}
.kn .kdot.off{background:transparent;border:1.5px solid var(--border-strong);}
.kn.kn-baru{border-color:var(--red);}
.kn .kn-e{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;color:var(--red);display:block;}
.knbar{height:5px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:10px;overflow:hidden;}
.knbar > i{display:block;height:100%;background:#fff;border-radius:99px;}
.mgrid button{position:relative;}
.mbadge{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:99px;}
.kn-sec{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);margin:16px 0 8px;text-transform:uppercase;}

/* ---------- reward ---------- */
.rw{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.rw + .rw{margin-top:10px;}
.rw .rw-n{font-weight:700;font-size:14.5px;}
.rw .rw-s{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);}
.rw .rw-p{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:var(--red);}

/* ---------- ledger ---------- */
.led{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
.led:last-child{border-bottom:none;}
.led .ld{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:74px;flex:none;}
.led .lv{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;}
.led .lv.pos{color:var(--good);}
.led .lv.neg{color:var(--bad);}
.led .lb2{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);width:48px;text-align:right;flex:none;}

/* ---------- admin ---------- */
.adm{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.adm-side{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.adm-side .a-brand{display:flex;align-items:baseline;gap:8px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
.adm-side .a-brand b{font-size:18px;font-weight:800;}
.adm-side .a-brand span{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;color:rgba(255,255,255,.55);text-transform:uppercase;}
.adm-side button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:none;border:none;color:rgba(255,255,255,.72);text-align:left;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;}
.adm-side button:hover{background:rgba(255,255,255,.07);color:#fff;}
.adm-side button.on{background:var(--red);color:#fff;}
.adm-side .cnt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:rgba(255,255,255,.14);padding:2px 7px;border-radius:99px;}
.adm-side button.on .cnt{background:rgba(0,0,0,.22);}
.adm-main{padding:26px 30px 60px;max-width:1180px;}
.adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.adm-head h1{font-size:26px;}
.adm-head .sub{font-size:13px;color:var(--ink-dim);margin-top:3px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:8px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:13px;background:var(--surface);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);}
td{padding:11px 13px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.thumb{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;background:var(--surface-3);}
.aq{display:flex;align-items:center;gap:13px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
.aq + .aq{margin-top:10px;}
.aq .aq-n{font-weight:700;font-size:14px;}
.aq .aq-s{font-size:12.5px;color:var(--ink-dim);}
.prog{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px;}
.prog > i{display:block;height:100%;background:var(--red);}

/* ---------- misc ---------- */
.empty{text-align:center;padding:34px 18px;color:var(--ink-dim);font-size:13.5px;}
.note{font-size:12px;color:var(--ink-dim);background:var(--surface-3);border-radius:10px;padding:11px 13px;}
.err{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);z-index:80;max-width:88vw;text-align:center;}
.toast.ok{background:var(--good);}
.toast.no{background:var(--bad);}
.modal-bd{position:fixed;inset:0;background:rgba(18,16,15,.62);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
.modal{background:var(--surface);border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:86vh;overflow-y:auto;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cmp img{width:100%;border-radius:10px;border:1px solid var(--border);}
.cmp .cl{text-align:center;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;}
.center-narrow{max-width:400px;margin:0 auto;padding:40px 18px;}
@media (max-width:860px){
  .adm{grid-template-columns:1fr;}
  .adm-side{position:static;height:auto;}
  .adm-side .a-nav{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .adm-main{padding:20px 16px 50px;}
  .wgrid{grid-template-columns:1fr !important;}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12.5px;color:var(--ink-dim);}
.wgrid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
.wpanel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;}
.wnode{border-radius:9px;overflow:hidden;margin-bottom:4px;}
.wnode-h{display:flex;align-items:center;gap:8px;padding:8px 6px;cursor:pointer;font-size:13px;}
.wnode-h:hover{background:var(--surface-2);}
.wnode-h .wc{width:14px;color:var(--ink-faint);font-size:11px;transition:transform .15s;}
.wnode-h.on .wc{transform:rotate(90deg);}
.wnode-nama{flex:1;font-weight:600;}
.wnode-n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);white-space:nowrap;}
.wnode-kids{padding-left:16px;border-left:1px solid var(--border);margin-left:13px;}
.skel{color:var(--ink-faint);font-size:13px;padding:14px 0;text-align:center;}
.rank-note{font-size:11.5px;color:var(--ink-dim);margin-top:4px;}
[hidden]{display:none!important;}
button.photo-tile{font:inherit;padding:0;width:100%;}

  if (!PROGRAM.jembatan) return null;
  if (!dbJembatan) dbJembatan = initializeFirestore(initializeApp(PROGRAM.jembatan.firebase, "jembatan"), { localCache: memoryLocalCache() });
  return dbJembatan;

async function tulisPeta(userId) {
  const dj = jembatanDb();
  if (!dj) return "mati";
  try { await setDoc(doc(dj, "peta", userId), { tim: PROGRAM.kode, waktu: serverTimestamp() }); return "baru"; }
  catch (e) { if (e.code === "permission-denied") return "ada"; throw e; }
}

async function kaitSetelahDaftar(userId) { await tulisPeta(userId); }
/* Admin, sekali saat jembatan baru dipasang: petakan semua petugas SF yang sudah ada (±1 read + 1 tulis per petugas) */
async function sinkronPetaJembatan(log) {
  if (!jembatanDb()) throw new Error("PROGRAM.jembatan belum diisi.");
  const ids = [];
  (await getDocs(collection(db, "petugas"))).forEach((d) => ids.push(d.id));
  const hasil = { baru: 0, ada: 0, gagal: 0 };
  for (let i = 0; i < ids.length; i += 20) {
    await Promise.all(ids.slice(i, i + 20).map((id) => tulisPeta(id).then((h) => { hasil[h === "baru" ? "baru" : "ada"]++; }).catch(() => { hasil.gagal++; })));
    if ((i / 20) % 10 === 0) log(fmtNum(Math.min(i + 20, ids.length)) + " / " + fmtNum(ids.length) + " diproses…");
  }
  return hasil;
}

/* Kode SF (sf_code) = ID dokumen = username. Contoh: SF-KUTAI-35, CVS-KAYU-AGUNG-03, ABDUL_MUHYI, ABDUL SYUKUR, SUSILO+KHOTIM.

/* ============ helper ============ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtTgl(iso) {
  if (!iso) return "-";
  try { return new Date(iso).toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "2-digit" }); }
  catch (e) { return iso; }
}
function fmtWaktu(iso) {
  if (!iso) return "-";
  try {
    const d = new Date(iso);
    return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) + " " +
      d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return iso; }
}
/* Periode dalam UTC agar sama persis dengan pengecekan kuota di security rules */
function periode(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
}
function hariIni() {
  const d = new Date();

}

function namaTampil(p) { return (p && (p.nama || p.kode || p.id)) || "-"; }

/* =====================================================================
   DATA LAYER
   - Petugas login tanpa PIN: Kode SF (satu kolom), terkunci ke 1 HP
     (identitas anonim perangkat disimpan di perangkat/{userId} dan sesiAuth/{authUid}).
   - Petugas membaca ringkasan (publik/katalog, publik/leaderboard) — bukan koleksi penuh.
   - ID dokumen deterministik = kunci anti-dobel di server.
   ===================================================================== */

const col = (n) => collection(db, n);
const unsubs = { admin: [], redeem: [] };
function stop(key) { unsubs[key].forEach((f) => { try { f(); } catch (e) {} }); unsubs[key] = []; }
function rows(qs) { const out = []; qs.forEach((d) => out.push(Object.assign({ id: d.id }, d.data()))); return out; }
function mapOf(qs) { const m = {}; qs.forEach((d) => { m[d.id] = d.data(); }); return m; }
const listOf = (o) => Object.keys(o || {}).map((k) => Object.assign({ id: k }, o[k]));
function errKode(kode, extra) { const e = new Error(kode); e.kode = kode; return Object.assign(e, extra || {}); }

/* Kirim batch ke server dengan batas waktu: kalau 25 detik belum dikonfirmasi server, anggap GAGAL
   dan beri tahu pengguna — jangan biarkan layar "menyimpan" selamanya atau menampilkan sukses palsu.
   Aman diulang: semua tulisan penting memakai ID dokumen tetap (ledger kue_/pt_/wel_, redeem per bulan). */
function kirim(b) {
  return Promise.race([b.commit(), new Promise((_, tolak) => setTimeout(() => tolak(errKode("lambat",
    { message: "Koneksi ke server bermasalah, data BELUM tersimpan. Periksa internet lalu coba lagi." })), 25000))]);
}

/* ---------- identitas perangkat ---------- */
async function pastikanAnon() {
  if (auth.authStateReady) await auth.authStateReady();
  const u = auth.currentUser;
  if (u && u.isAnonymous) {
    try { await u.getIdToken(true); return u.uid; }
    catch (e) { await signOut(auth).catch(() => {}); }
  } else if (u) {
    await signOut(auth);
  }
  return (await signInAnonymously(auth)).user.uid;
}

/* Saat aplikasi dibuka: perangkat ini sudah terikat ke akun siapa? */
async function sesiPerangkat() {
  if (auth.authStateReady) await auth.authStateReady();
  const u = auth.currentUser;
  if (!u || !u.isAnonymous) return null;
  try {
    const sa = await getDoc(doc(db, "sesiAuth", u.uid));
    if (!sa.exists()) return null;
    if (sa.data().tipe === "organik") return { tipe: "organik", email: sa.data().email };
    return { tipe: "petugas", userId: sa.data().userId };
  } catch (e) { return null; }
}

async function ikatPerangkat(userId, kode) {
  const authUid = await pastikanAnon();
  const sa = await getDocFromServer(doc(db, "sesiAuth", authUid));
  if (sa.exists()) {
    if (sa.data().userId === userId) {
      /* Sesi lama masih ada, tapi akun mungkin sudah dipindah ke HP lain → tawarkan pindah balik */
      try { await getDocFromServer(doc(db, "perangkat", userId)); } catch (e) { if (e.code === "permission-denied") throw errKode("terikat-hp-lain"); throw e; }
      return "sudah";
    }
    throw errKode("hp-akun-lain", { akunLain: sa.data().userId });
  }
  return authUid;
}

async function masukPetugas(idInput, usernameInput, idSfInput) {
  const userId = normUserId(idInput);
  const kode = normKode(usernameInput);
  if (!USERID_RE.test(userId)) throw errKode("format-id");
  if (!kode) throw errKode("username-kosong");
  /* Selalu tanya SERVER — jangan pernah memutuskan login/daftar dari salinan di HP */
  const d = await getDocFromServer(doc(db, "petugas", userId));
  if (!d.exists()) throw errKode("tidak-terdaftar");
  const p = d.data();
  if (p.kode !== kode) throw errKode("username-salah");
  /* ID SF: hanya diperiksa kalau akun ini SUDAH punya ID SF (rules memeriksa hal yang sama) */
  const idSf = normIdSf(idSfInput);
  if (p.idSf && !PROGRAM.login.tampilIdSf) throw errKode("idsf-perlu");
  if (p.idSf && !idSf) throw errKode("idsf-kosong");
  if (p.idSf && idSf !== p.idSf) throw errKode("idsf-salah");
  if (p.status === "nonaktif") throw errKode("nonaktif");
  const authUid = await ikatPerangkat(userId, kode);
  if (authUid === "sudah") return userId;
  const b = writeBatch(db);
  b.set(doc(db, "perangkat", userId), Object.assign({ authUid, kode, waktu: nowIso() }, p.idSf ? { idSf } : {}));
  b.set(doc(db, "sesiAuth", authUid), { userId });
  try { await kirim(b); }
  catch (e) { if (e.code === "permission-denied") throw errKode("terikat-hp-lain"); throw e; }
  return userId;
}

/* ---------- Organik: tim internal Telkomsel, login nama+email, 1 akun = 1 HP juga ---------- */
function normEmail(s) { return String(s || "").trim().toLowerCase(); }

async function ikatPerangkatOrganik(email) {
  const authUid = await pastikanAnon();
  const sa = await getDocFromServer(doc(db, "sesiAuth", authUid));
  if (sa.exists()) {
    if (sa.data().tipe === "organik" && sa.data().email === email) return "sudah";
    throw errKode("hp-akun-lain");

  return authUid;
}

async function masukOrganik(nikInput, emailInput) {
  await pastikanAnon();
  const email = normEmail(emailInput);
  const nik = String(nikInput || "").trim();
  if (!email) throw errKode("format-id");
  if (!nik) throw errKode("username-kosong");
  let d;
  try { d = await getDocFromServer(doc(db, "organik", email)); }
  catch (e) {
    /* Ditolak = akun sudah terikat ke perangkat lain → coba tambahkan perangkat ini (maks 3) */
    if (e.code === "permission-denied") { await tambahPerangkatOrganik(email, nik); return email; }
    throw e;
  }
  if (!d.exists()) throw errKode("tidak-terdaftar");
  const o = d.data();
  if (String(o.nik || "").trim() !== nik) throw errKode("username-salah");
  if (o.status === "nonaktif") throw errKode("nonaktif");
  const authUid = await ikatPerangkatOrganik(email);
  if (authUid === "sudah") return email;
  const b = writeBatch(db);
  b.set(doc(db, "perangkat_organik", email), { authUid, waktu: nowIso() });
  b.set(doc(db, "sesiAuth", authUid), { email, tipe: "organik" });
  try { await kirim(b); }
  catch (e) { if (e.code === "permission-denied") throw errKode("terikat-hp-lain"); throw e; }
  return email;
}

/* ===== TAMBAH PERANGKAT ORGANIK (sejak 13 Okt 2026) =====
   Organik memantau dari laptop & turun lapangan pakai HP → 1 akun boleh 3 perangkat.
   Perangkat ke-2 & ke-3 ditambah sendiri saat masuk; NIK dicocokkan di SERVER (HP baru tidak bisa
   membaca data akun), tebakan dicatat dulu di percobaan_organik (3/hari) supaya tidak bisa ditebak terus.
   Perangkat ke-4: Admin Reset HP (semua slot dilepas), lalu masuk ulang. Reads: ±3 sekali saja. */
const ORG_MAKS_PERANGKAT = 3;
async function tambahPerangkatOrganik(email, nik) {
  const authUid = await ikatPerangkatOrganik(email);
  if (authUid === "sudah") return;
  const p = await getDocFromServer(doc(db, "perangkat_organik", email));
  const terpakai = p.exists() ? 1 + ((p.data().lain || []).length) : 0;
  if (terpakai >= ORG_MAKS_PERANGKAT) throw errKode("slot-penuh");
  let bukti = null, ke = 0;
  for (let k = 1; k <= 3 && !bukti; k++) {
    const id = email + "_" + tglUTC() + "_" + k;
    const b1 = writeBatch(db);
    b1.set(doc(db, "percobaan_organik", id), { email, authUid, nik, waktu: serverTimestamp() });
    try { await kirim(b1); bukti = id; ke = k; }
    catch (e) { if (e.code !== "permission-denied") throw e; }
  }
  if (!bukti) throw errKode("slot-kunci");
  const b = writeBatch(db);
  b.update(doc(db, "perangkat_organik", email), { lain: arrayUnion(authUid), bukti });
  b.set(doc(db, "sesiAuth", authUid), { email, tipe: "organik" });
  try { await kirim(b); }
  catch (e) { if (e.code === "permission-denied") throw errKode("slot-ditolak", { sisa: 3 - ke }); throw e; }
  S.orgSlotBaru = terpakai + 1;
}

/* Daftar Organik: pilih level (area/regional/branch/cluster) + lokasinya, status review sampai disetujui Admin */
/* Wilayah apa saja yang tercakup di bawah level+value yang dipilih Organik — dihitung dari
   Master Wilayah yang sudah dimuat gratis di client. Dipakai buat batasi query & tulis ringkasan
   supaya Organik cuma bisa sentuh wilayah di bawah cakupannya sendiri (lihat firestore.rules).
   Level 'hq' tidak ada kolomnya di Master Wilayah — artinya cakupan seluruh baris (nasional). */
function hitungCakupan(level, value) {
  const baris = level === "hq" ? C.wilayah : C.wilayah.filter((r) => r[level] === value);
  const uniq = (arr) => arr.filter((v, i, a) => v && a.indexOf(v) === i);
  return {
    cakupanBranch: uniq(baris.map((r) => r.branch)),
    cakupanRegional: uniq(baris.map((r) => r.regional)),
    cakupanArea: uniq(baris.map((r) => r.area))
  };
}

async function daftarOrganik(d) {

  await pastikanAnon();
  const email = normEmail(d.email);
  const nama = d.nama.trim();
  const nik = String(d.nik || "").trim();
  if (!email || !nama || !nik) throw errKode("format-id");
  /* Email yang belum ada selalu boleh dicek (rules: resource == null); ditolak = sudah ada & terikat HP lain */
  let ada;
  try { ada = (await getDocFromServer(doc(db, "organik", email))).exists(); }
  catch (e) { if (e.code === "permission-denied") throw errKode("sudah-terdaftar"); throw e; }

  b.set(doc(db, "sesiAuth", authUid), { email, tipe: "organik" });
  b.set(doc(db, "organik", email), pub);
  await kirim(b);
  return email;
}

/* Admin: bangun ulang semua dokumen kontak dari petugas aktif + petugas_cek. Aman diulang. */
async function bangunKontak(log) {
  log("Membaca petugas aktif & nomor…");
  const [ps, cs] = await Promise.all([getDocs(query(col("petugas"), where("status", "==", "aktif"))), getDocs(col("petugas_cek"))]);
  const nomorDari = {};
  cs.forEach((d) => { const n = d.data().nomor; if (n) nomorDari[d.id] = String(n).trim(); });
  const perBranch = {};
  let jumlah = 0, tanpaNomor = 0;
  ps.forEach((d) => {
    const p = d.data();
    if (!p.branch) return;
    if (!nomorDari[d.id]) { tanpaNomor++; return; }
    (perBranch[p.branch] = perBranch[p.branch] || {})[d.id] = nomorDari[d.id];
    jumlah++;
  });
  const branches = Object.keys(perBranch);
  log("Menulis " + branches.length + " dokumen branch…");
  for (let i = 0; i < branches.length; i += 400) {
    const b = writeBatch(db);
    branches.slice(i, i + 400).forEach((br) => b.set(doc(db, "kontak", br), { nomor: perBranch[br], oleh: "admin" }));
    await b.commit();
  }
  return { jumlah, branch: branches.length, tanpaNomor, dibaca: ps.size + cs.size };
}
/* Migrasi sekali (hemat tahap 2b): salin status kuesioner/post test yang SUDAH ada di koleksi
   respons & hasil ke ringkasan kueSelesai/ptHasil di dokumen petugas. Aman diulang (merge). */
async function sinkronStatusTugas(log) {
  log("Membaca respons & hasil…");
  const [rs, hs] = await Promise.all([getDocs(col("respons")), getDocs(col("hasil"))]);
  const per = {};
  rs.forEach((d) => { const r = d.data(); if (!r.userId || !r.kuesionerId) return; ((per[r.userId] = per[r.userId] || {}).kueSelesai = per[r.userId].kueSelesai || {})[r.kuesionerId] = r.waktu || nowIso(); });
  hs.forEach((d) => { const h = d.data(); if (!h.userId || !h.testId) return; ((per[h.userId] = per[h.userId] || {}).ptHasil = per[h.userId].ptHasil || {})[h.testId] = { benar: h.benar || 0, total: h.total || 0, poin: h.poin || 0, waktu: h.waktu || nowIso() }; });
  /* Hanya petugas yang dokumennya masih ada — jangan sampai membuat dokumen petugas "hantu" */
  const cek = await Promise.all(Object.keys(per).map((id) => getDoc(doc(db, "petugas", id)).then((d) => (d.exists() ? id : null))));
  const ids = cek.filter(Boolean);
  log("Menulis ringkasan ke " + ids.length + " petugas…");
  for (let i = 0; i < ids.length; i += 400) {
    const b = writeBatch(db);
    ids.slice(i, i + 400).forEach((id) => b.update(doc(db, "petugas", id), per[id]));

  return { petugas: ids.length, respons: rs.size, hasil: hs.size };
}

/* Cari korban "data hantu": HP SUDAH terikat (perangkat ada = login berhasil di server) tetapi
   status di server masih belum_lengkap (profil tidak pernah tersimpan). Hemat: daftar belum_lengkap
   diambil dari ringkasan branch (±61 read), lalu tiap kandidat dicek ulang langsung ke server. */
async function cariProfilBelumTersimpan(log) {
  log("Membaca daftar HP terhubung…");
  const ps = await getDocs(col("perangkat"));
  const hp = {};
  ps.forEach((d) => { hp[d.id] = d.data().waktu || ""; });
  log(fmtNum(ps.size) + " HP terhubung. Membaca ringkasan branch…");
  if (!C.wilayahLoaded) await loadWilayah();
  const branches = C.wilayah.map((w) => w.branch).filter((v, i, a) => v && a.indexOf(v) === i);
  const docs = await Promise.all(branches.map((b) => bacaRingkasan("branch_" + b)));
  const kandidat = [];
  docs.forEach((r) => Object.keys((r && r.anggota) || {}).forEach((id) => { if (r.anggota[id].status === "belum_lengkap" && hp[id] !== undefined) kandidat.push(id); }));
  log(fmtNum(kandidat.length) + " kandidat. Memastikan langsung ke server…");
  const hasil = (await Promise.all(kandidat.map((id) => getDoc(doc(db, "petugas", id)).then((d) => (d.exists() ? Object.assign({ id }, d.data()) : null)))))
    .filter((p) => p && p.status === "belum_lengkap")
    .map((p) => Object.assign(p, { hpSejak: hp[p.id] }))
    .sort((a, b) => (b.hpSejak || "").localeCompare(a.hpSejak || ""));
  return { daftar: hasil, hp: ps.size };
}

/* ===== PINDAH HP MANDIRI (petugas, sejak 12 Okt 2026) =====
   Ditulis ke petugas: "1x per 30 hari". Sistem (rules) mengizinkan tiap 7 hari — keputusan Admin.
   Verifikasi: 4 digit terakhir nomor aktif terdaftar, dicocokkan di SERVER (nomor tak pernah dikirim ke HP).
   Tebakan dicatat dulu di percobaan_pindah (3 slot/hari) → tebakan salah tetap terhitung. */
const PINDAH_JEDA_HARI = 7, PINDAH_TULISAN_HARI = 30;
const tglUTC = () => new Date().toISOString().slice(0, 10);
const tambahHariIso = (iso, n) => new Date(new Date(iso).getTime() + n * 86400000).toISOString();
async function statusJedaPindah(userId) {
  const qs = await getDocsFromServer(query(col("log_pindah"), where("userId", "==", userId)));
  const ev = rows(qs).map((x) => Object.assign(x, { t: x.waktu && x.waktu.toDate ? x.waktu.toDate().toISOString() : String(x.waktu || "") }))
    .sort((a, b) => (b.t || "").localeCompare(a.t || ""));
  const terakhir = ev.find((x) => x.cara === "mandiri");
  const dibuka = terakhir && ev.some((x) => x.cara === "buka_jeda" && x.t > terakhir.t);
  const masihJeda = !!terakhir && !dibuka && jamSejak(terakhir.t) < PINDAH_JEDA_HARI * 24;
  return { terakhir: terakhir ? terakhir.t : null, masihJeda, bisaLagi: terakhir ? tambahHariIso(terakhir.t, PINDAH_TULISAN_HARI) : null };
}
async function pindahHpMandiri(userId, kode, digit4, idSf) {
  const authUid = await pastikanAnon();
  /* 1) Catat tebakan di slot kosong hari ini (1..3). Slot terisi → create ditolak → coba slot berikutnya. */
  let bukti = null, ke = 0;
  for (let k = 1; k <= 3 && !bukti; k++) {

    const b1 = writeBatch(db);
    b1.set(doc(db, "percobaan_pindah", id), { userId, authUid, tebakan: digit4, waktu: serverTimestamp() });
    try { await kirim(b1); bukti = id; ke = k; }
    catch (e) { if (e.code !== "permission-denied") throw e; }
  }
  if (!bukti) throw errKode("pindah-kunci");
  /* 2) Pindahkan: perangkat → HP ini, sesi (kalau belum ada), catatan log. Server menolak kalau 4 digit salah / masih jeda. */
  const sa = await getDocFromServer(doc(db, "sesiAuth", authUid));
  if (sa.exists() && sa.data().userId !== userId) throw errKode("hp-akun-lain");
  const b = writeBatch(db);
  b.set(doc(db, "perangkat", userId), Object.assign({ authUid, kode, waktu: nowIso(), pindahAt: serverTimestamp(), bukti }, idSf ? { idSf } : {}));
  if (!sa.exists()) b.set(doc(db, "sesiAuth", authUid), { userId });
  b.set(doc(db, "log_pindah", bukti), { userId, cara: "mandiri", waktu: serverTimestamp() });
  try { await kirim(b); }
  catch (e) { if (e.code === "permission-denied") throw errKode("pindah-ditolak", { sisa: 3 - ke }); throw e; }
  return true;
}

/* Nama harus nama orang: tolak isian yang berupa deretan angka (NIK/ID/nomor HP salah kolom) */
function namaTidakWajar(nama) {
  const n = String(nama || "").trim();
  if (/\d{4,}/.test(n) || (n.replace(/[^0-9]/g, "").length > n.replace(/[^A-Za-z]/g, "").length)) return "Nama tidak boleh berisi angka (NIK/ID/nomor HP). Isi nama lengkap sesuai KTP.";
  if (n.replace(/[^A-Za-z]/g, "").length < 2) return "Nama lengkap wajib diisi dengan huruf.";
  return "";
}

/* ---------- cache di HP (hemat reads) ----------
   publik/versi = {katalog, leaderboard, peringkat}: penanda kapan Admin terakhir mengubah masing-masing.
   HP cukup membaca dokumen kecil ini (1 read per buka aplikasi); dokumen besarnya hanya diambil ulang
   kalau versinya beda dengan yang tersimpan di HP. Tanpa localStorage (mode privat dsb.) tetap jalan,
   hanya tidak hemat. */
function cacheAmbil(k) { try { return JSON.parse(localStorage.getItem(PROGRAM.simpanPrefix + k) || "null"); } catch (e) { return null; } }
function cacheSimpan(k, v) { try { localStorage.setItem(PROGRAM.simpanPrefix + k, JSON.stringify(v)); } catch (e) {} }
let versiJanji = null;
function loadVersi() {
  if (!versiJanji) versiJanji = getDoc(doc(db, "publik", "versi")).then((d) => (d.exists() ? d.data() : {})).catch(() => ({}));
  return versiJanji;
}
/* Ambil publik/{nama}: dari cache HP kalau versinya sama, selain itu dari server lalu simpan */
async function ambilPublik(nama, force) {
  const v = (await loadVersi())[nama];
  const c = cacheAmbil(nama);
  if (!force && v && c && c.versi === v) return c.data;
  const d = await getDoc(doc(db, "publik", nama));
  const data = d.exists() ? d.data() : null;
  if (v && data) cacheSimpan(nama, { versi: v, data });
  return data;
}

async function loadKatalog(force) {
  if (C.katalog.loaded && !force) return;
  try {
    if (force) versiJanji = null; // "Muat ulang": cek versi terbaru dulu, katalog tetap dari cache kalau tidak berubah
    const k = (await ambilPublik("katalog", force && S.adminOk)) || {};
    C.katalog = { kuesioner: k.kuesioner || [], posttest: k.posttest || [], knowledge: k.knowledge || [], panduan: k.panduan || [], diperbarui: k.diperbarui || null, loaded: true };
  } catch (e) { C.katalog.loaded = true; }
  render();
}

  } catch (e) { C.lb = { diperbarui: null }; }

/* Peringkat TANPA hitungan server: dihitung di HP dari sebaran poin (publik/peringkat, ditulis Admin
   sekali sehari bersama ringkasan). Poin petugas sendiri tetap yang terbaru dari dokumennya. */
async function loadRank(force) {
  const p = S.profilSaya;
  if (!p || (C.rank && !force)) return;
  const f = fGrp(p.group), kunci = GRP_FIELD[p.group] || p.group; // group baru: sebaran disimpan per nama group
  try {
    const pr = await ambilPublik("peringkat");
    if (!pr || !pr.dist) { C.rank = null; render(); return; }
    const atas = (m, x) => Object.keys(m || {}).reduce((s, k) => s + (Number(k) > x ? m[k] : 0), 0);
    const jml = (m) => Object.values(m || {}).reduce((s, n) => s + n, 0);
    C.rank = { global: atas(pr.dist.semua, p.poinPeringkat || 0) + 1, total: jml(pr.dist.semua),
      grup: atas(pr.dist[kunci], p[f] || 0) + 1, totalGrup: jml(pr.dist[kunci]), per: pr.diperbarui || null };
  } catch (e) { C.rank = null; }
  render();
}

const RIWAYAT_LIMIT = 50;
async function loadSaya(userId) {
  /* Sejak hemat tahap 2b: status kuesioner/post test dibaca dari dokumen petugas (kueSelesai/ptHasil),
     jadi respons & hasil TIDAK lagi di-query tiap buka. Redeem tetap (saldo tertahan & kuota bulanan). */
  const nama = ["redeem"];

      .concat(nama.map((n) => getDocs(query(col(n), where("userId", "==", userId), orderBy("waktu", "desc"), limit(RIWAYAT_LIMIT))))));

       tunggu antrean terkirim, lalu muat ulang dari server supaya yang tampil = isi server */
    if (pd.metadata && pd.metadata.hasPendingWrites && S.tertunda !== "kirim") {
      S.tertunda = "kirim";
      Promise.race([waitForPendingWrites(db).then(() => "ok"), new Promise((r) => setTimeout(() => r("lambat"), 30000))])
        .then((h) => { S.tertunda = h === "ok" ? null : "gagal"; if (h === "ok") { toast("ok", "Data tertunda berhasil terkirim ke server."); loadSaya(userId); } else render(); });
    }
    nama.forEach((n, i) => {
      C.mine[n] = rows(hasil[i + 1]).sort((a, b) => (a.waktu || "").localeCompare(b.waktu || ""));
      C.mine[n + "Penuh"] = hasil[i + 1].size < RIWAYAT_LIMIT; // false = kemungkinan masih ada yang lebih lama, belum ditampilkan
    });
    C.mine.loaded = true;
    if (S.profilSaya.status === "nonaktif") { keluarPetugas("Akun dinonaktifkan. Hubungi Admin."); return false; }
  } catch (e) {
    toast("no", "Gagal memuat data akun: " + e.message);

  render();
  return true;
}

/* ---------- Organik: ringkasan wilayah (lazy rebuild, cache 24 jam — bukan realtime) ----------
   Cuma level Cluster yang query koleksi petugas langsung (kecil, puluhan orang per cluster).
   Branch/Regional/Area dihitung dengan MENJUMLAHKAN ringkasan level di bawahnya (rekursif),
   jadi biaya baca TIDAK pernah sebesar "semua petugas di 1 area sekaligus" dalam satu query —
   dan sekali di-cache, wilayah yang sama dipakai bersama oleh siapa pun yang membukanya
   dalam 24 jam itu, terlepas berapa kali atau berapa Organik yang buka. */
const RINGKASAN_BASI_JAM = 24;
function jamSejak(iso) { return iso ? (Date.now() - new Date(iso).getTime()) / 3600000 : Infinity; }


function kosongGrup() {
  const g = {};
  GROUPS.forEach((k) => { g[k] = { total: 0, aktif: 0 }; });
  return g;
}

function anakWilayah(childLevel, level, value) {
  const baris = level === "hq" ? C.wilayah : C.wilayah.filter((r) => r[level] === value);
  return baris.map((r) => r[childLevel]).filter((v, i, a) => v && a.indexOf(v) === i);
}

/* Gabungkan topGrup {group: [...]} jadi 1 daftar campuran, diurutkan poin — dipakai untuk tampilan
   "Semua Group". 100% akurat karena top-N campuran pasti bagian dari gabungan top-N tiap grup. */
function gabungTopGrup(topGrup) {
  if (!topGrup) return [];
  return Object.values(topGrup).flat().sort((a, b) => (b.poin || 0) - (a.poin || 0));
}
/* Top-N per group dari satu daftar anggota {id,nama,group,kode,poin} — dipakai baik di Branch
   (dari anggota lengkap) maupun di rollup (dari gabungan topGrup anak-anaknya). */
function topGrupDari(anggotaArr, n) {
  const out = {};
  GROUPS.forEach((g) => {
    out[g] = anggotaArr.filter((a) => a.group === g).sort((a, b) => (b.poin || 0) - (a.poin || 0)).slice(0, n || 20);
  });
  return out;
}

/* Branch = leaf sekarang (HQ menggantikan Cluster sebagai level teratas) — satu-satunya level
   yang query petugas langsung. Anggota disimpan LENGKAP (bukan top-N) karena 1 branch masih
   realistis ukurannya (puluhan-ratusan orang) — dokumennya tetap jauh di bawah batas 1 MB.
   topGrup (top 20 per group) dihitung SEKALIAN dari data yang sama, tanpa baca tambahan —
   dipakai bareng oleh Leaderboard per Wilayah (Admin) & Daftar Anggota (Organik). */
/* Susun 1 dokumen ringkasan branch dari daftar petugas yang SUDAH ada di memori ({id, ...data}) */
function bangunBranch(branchName, list) {
  const anggota = {};
  const grup = kosongGrup();
  let total = 0;
  const daftar = [];
  const anak = {}; // rincian per cluster {total, aktif} — untuk tampilan ringkasan Organik
  list.forEach((p) => {
    if (!grup[p.group]) return; // grup di luar 3 yang dikenal — dilewati dari agregat
    grup[p.group].total++;
    if (p.status === "aktif") grup[p.group].aktif++;
    const cl = p.cluster || "(Tanpa cluster)";
    if (!anak[cl]) anak[cl] = { total: 0, aktif: 0 };
    anak[cl].total++;
    if (p.status === "aktif") anak[cl].aktif++;
    const orang = { id: p.id, nama: namaTampil(p), group: p.group, kode: p.kode || "", poin: p.poinPeringkat || 0, branch: branchName };
    anggota[p.id] = { nama: orang.nama, group: p.group, kode: p.kode || "", poin: orang.poin, cluster: p.cluster || "", status: p.status };
    daftar.push(orang);
    total += p.poinPeringkat || 0;
  });
  return { level: "branch", wilayah: branchName, grup, total_poin: total, jumlah_anggota: list.length, anggota, topGrup: topGrupDari(daftar, 20), anak, diperbarui: nowIso() };
}
async function rebuildBranch(branchName) {
  const qs = await getDocs(query(col("petugas"), where("branch", "==", branchName), where("status", "in", ["belum_lengkap", "aktif"])));
  const data = bangunBranch(branchName, rows(qs));
  await setDoc(doc(db, "ringkasan", "branch_" + branchName), data);
  return data;
}

/* Regional/Area/HQ: JUMLAHKAN ringkasan level-di-bawahnya (rekursif) — tidak pernah query petugas
   langsung, supaya biayanya tidak pernah sebesar "semua orang di 1 area/nasional sekaligus".
   topGrup digabung dari topGrup anak-anaknya lalu di-top-20-kan ulang (bukan gabung SEMUA anggota) —
   ini tetap 100% akurat: top-20 gabungan sebuah grup pasti bagian dari gabungan top-20 tiap anaknya. */
async function rebuildRollup(level, value) {
  const childLevel = { area: "regional", regional: "branch", hq: "area" }[level];
  /* Anak-anak dimuat paralel (bukan satu per satu) — HQ punya puluhan branch di bawahnya */
  const namaAnak = anakWilayah(childLevel, level, value);
  const docAnak = await Promise.all(namaAnak.map((nv) => muatAtauRebuild(childLevel, nv)));
  const data = gabungAnak(level, value, namaAnak, docAnak);
  await setDoc(doc(db, "ringkasan", level + "_" + value), data);
  return data;
}
/* Jumlahkan dokumen anak (sudah di memori) jadi 1 dokumen level di atasnya */
function gabungAnak(level, value, namaAnak, docAnak) {
  let total = 0, jumlah = 0;
  const calonPerGrup = {};
  GROUPS.forEach((g) => { calonPerGrup[g] = []; });
  const grup = kosongGrup();
  const anak = {}; // rincian per wilayah anak {total, aktif} — untuk tampilan ringkasan Organik
  docAnak.forEach((d, i) => {
    d = d || {};
    total += d.total_poin || 0;
    jumlah += d.jumlah_anggota || 0;
    const rinci = { total: 0, aktif: 0 };
    Object.keys(grup).forEach((g) => {
      grup[g].total += (d.grup && d.grup[g] ? d.grup[g].total : 0);
      grup[g].aktif += (d.grup && d.grup[g] ? d.grup[g].aktif : 0);
      rinci.total += (d.grup && d.grup[g] ? d.grup[g].total : 0);
      rinci.aktif += (d.grup && d.grup[g] ? d.grup[g].aktif : 0);
      calonPerGrup[g] = calonPerGrup[g].concat((d.topGrup && d.topGrup[g]) || []);
    });
    anak[namaAnak[i]] = rinci;
  });
  const topGrup = {};
  Object.keys(calonPerGrup).forEach((g) => { topGrup[g] = calonPerGrup[g].sort((a, b) => (b.poin || 0) - (a.poin || 0)).slice(0, 20); });
  return { level, wilayah: value, grup, total_poin: total, jumlah_anggota: jumlah, topGrup, anak, diperbarui: nowIso() };
}

/* ===== Hitung ulang HANYA oleh Admin, sekali sehari (sejak 2026-10-09) =====
   Dulu setiap Organik/Admin yang membuka saat cache >24 jam ikut menghitung ulang seluruh petugas
   (±2.300 reads tiap kali) — terlihat sebagai lonjakan ±7K/jam di jam yang sama tiap hari.
   Sekarang: Organik & petugas HANYA membaca hasil (berapa pun umurnya); Admin menghitung ulang
   SEMUA wilayah dalam 1 query petugas (±1.800 reads) + menulis peringkat & leaderboard sekalian.
   Kunci di publik/ringkasanStatus mencegah dua Admin/tab menghitung bersamaan. */
async function bacaRingkasan(rid) {
  try { const d = await getDoc(doc(db, "ringkasan", rid)); return d.exists() ? d.data() : null; }
  catch (e) { return null; }
}
/* Admin saja: pakai dokumen yang ada (berapa pun umurnya); hitung hanya kalau belum pernah ada */
async function muatAtauRebuild(level, value) {
  const ada = await bacaRingkasan(level + "_" + value);
  if (ada) return ada;
  return level === "branch" ? rebuildBranch(value) : rebuildRollup(level, value);
}
/* Versi ringkasan yang boleh dibaca pintu utama (Organik): hanya angka, tanpa data orang */
function ringkasPublik(d) {
  return { tim: PROGRAM.kode, level: d.level, wilayah: d.wilayah, grup: d.grup || {}, total_poin: d.total_poin || 0,
    jumlah_anggota: d.jumlah_anggota || 0, anak: d.anak || {}, diperbarui: d.diperbarui || nowIso() };
}
async function perbaruiRingkasanNasional(paksa) {
  const stRef = doc(db, "publik", "ringkasanStatus");
  const st = (await getDoc(stRef)).data() || {};
  if (!paksa) {
    if (st.selesai && st.selesai >= (st.mulai || "") && jamSejak(st.selesai) < RINGKASAN_BASI_JAM) return null;
    if (st.mulai && (!st.selesai || st.selesai < st.mulai) && jamSejak(st.mulai) < 0.25) return null; // sedang dihitung di tempat lain
  }
  const oleh = S.adminUser ? S.adminUser.email : "admin";
  await setDoc(stRef, { mulai: nowIso(), oleh }, { merge: true });
  if (!C.wilayahLoaded) await loadWilayah();
  const semua = rows(await getDocs(query(col("petugas"), where("status", "in", ["belum_lengkap", "aktif"]))));
  const perBranch = {};
  semua.forEach((p) => { (perBranch[p.branch] = perBranch[p.branch] || []).push(p); });
  const tulis = {};
  const uniq = (a) => a.filter((v, i, x) => v && x.indexOf(v) === i);
  uniq(C.wilayah.map((w) => w.branch)).forEach((b) => { tulis["branch_" + b] = bangunBranch(b, perBranch[b] || []); });
  [["regional", "branch"], ["area", "regional"]].forEach(([lv, anakLv]) => {
    uniq(C.wilayah.map((w) => w[lv])).forEach((v) => {
      const nama = anakWilayah(anakLv, lv, v);
      tulis[lv + "_" + v] = gabungAnak(lv, v, nama, nama.map((n) => tulis[anakLv + "_" + n]));
    });
  });
  const areas = anakWilayah("area", "hq", "NASIONAL");
  tulis.hq_NASIONAL = gabungAnak("hq", "NASIONAL", areas, areas.map((a) => tulis["area_" + a]));
  /* Peringkat petugas: sebaran poin {poin: jumlah orang} — petugas menghitung peringkatnya sendiri dari sini */
  const dist = { semua: {} };
  /* Kunci sebaran per group: pDS/pYPCR/pBUD untuk 3 group lama (HP versi lama tetap membaca ini),
     nama group untuk group baru (mis. "Promotor") */
  const kunciDist = (g) => GRP_FIELD[g] || g;
  GROUPS.forEach((g) => { dist[kunciDist(g)] = {}; });
  const tambah = (m, x) => { m[x] = (m[x] || 0) + 1; };
  semua.forEach((p) => { tambah(dist.semua, p.poinPeringkat || 0); if (GROUPS.includes(p.group)) tambah(dist[kunciDist(p.group)], p[fGrp(p.group)] || 0); });
  /* Leaderboard nasional dari data yang sama — tidak perlu query terpisah */
  const top = (field, g) => semua.filter((p) => p.status === "aktif" && (!g || p.group === g))
    .sort((a, b) => (b[field] || 0) - (a[field] || 0)).slice(0, 20)
    .map((p) => ({ id: p.id, nama: namaTampil(p), group: p.group, area: p.area || "", regional: p.regional || "", poin: p[field] || 0 }));
  const kini = nowIso();
  const lb = { semua: top("poinPeringkat"), diperbarui: kini };
  GROUPS.forEach((g) => { lb[g] = top(fGrp(g), g); });
  const kunci = Object.keys(tulis);
  for (let i = 0; i < kunci.length; i += 40) {
    const b = writeBatch(db);
    kunci.slice(i, i + 40).forEach((k) => { b.set(doc(db, "ringkasan", k), tulis[k]); b.set(doc(db, "ringkasan_publik", k), ringkasPublik(tulis[k])); });
    await b.commit();
  }
  const b2 = writeBatch(db);
  b2.set(doc(db, "publik", "peringkat"), { dist, diperbarui: kini });
  b2.set(doc(db, "publik", "leaderboard"), lb);
  b2.set(doc(db, "publik", "versi"), { peringkat: kini, leaderboard: kini, ringkasanPublik: kini }, { merge: true });
  b2.set(stRef, { selesai: kini, dibaca: semua.length }, { merge: true });
  await b2.commit();
  C.lb = lb; C.adm.ringkasanWilayah = {};
  return tulis.hq_NASIONAL;
}

/* ---------- ringkasan wilayah untuk Admin (pakai ulang cache ringkasan milik Organik) ----------
   Admin melihat SEMUA wilayah (bukan cuma cakupan sendiri), tapi tetap lewat muatAtauRebuild()
   yang sama supaya cache 24 jam-nya dipakai bersama — kalau Organik sudah pernah membuka wilayah
   yang sama hari itu, Admin tinggal baca cache-nya, tidak query petugas lagi. */
async function muatRingkasanWilayah(level, value, paksa) {
  const key = level + "_" + value;
  if (!paksa && C.adm.ringkasanWilayah[key]) return C.adm.ringkasanWilayah[key];
  try {
    const data = paksa ? await (level === "branch" ? rebuildBranch(value) : rebuildRollup(level, value)) : await muatAtauRebuild(level, value);
    C.adm.ringkasanWilayah[key] = data;
    render();
    return data;
  } catch (e) { toast("no", "Gagal memuat ringkasan " + value + ": " + e.message); return null; }
}
function muatRingkasanArea() {
  const areas = C.wilayah.map((w) => w.area).filter((v, i, a) => v && a.indexOf(v) === i).sort();
  areas.forEach((a) => muatRingkasanWilayah("area", a));
}

/* ---------- turunan ---------- */
function saldoSaya() { return (S.profilSaya && S.profilSaya.saldo) || 0; }
function poinPeringkatSaya() { return (S.profilSaya && S.profilSaya.poinPeringkat) || 0; }
function ditahanSaya() { return C.mine.redeem.filter((r) => r.status === "pending").reduce((s, r) => s + (r.poin || 0), 0); }
function tersediaSaya() { return saldoSaya() - ditahanSaya(); }
function redeemBulanIniSaya() { return C.mine.redeem.filter((r) => r.periode === periode() && r.status !== "ditolak"); }
/* Status tugas dibaca dari ringkasan di dokumen petugas (kueSelesai / ptHasil) */
function sudahKuesioner(kid) {
  return !!((S.profilSaya && S.profilSaya.kueSelesai) || {})[kid] || C.mine.respons.some((r) => r.kuesionerId === kid);
}
function hasilPosttest(tid) {
  const h = ((S.profilSaya && S.profilSaya.ptHasil) || {})[tid];
  return h ? Object.assign({ testId: tid }, h) : C.mine.hasil.find((x) => x.testId === tid);
}
function bolehBeraktivitas() { return !!(S.profilSaya && S.profilSaya.status === "aktif"); }

function sesuaiTarget(item, p) {
  const t = item.target || {};
  if (t.group && t.group !== "semua" && t.group !== p.group) return false;
  if (t.area && t.area !== p.area) return false;
  if (t.regional && t.regional !== p.regional) return false;
  const h = hariIni();
  if (item.mulai && h < item.mulai) return false;
  if (item.selesai && h > item.selesai) return false;
  return true;
}
function tugasSaya() {
  const p = S.profilSaya;
  return {
    ku: C.katalog.kuesioner.filter((k) => sesuaiTarget(k, p)),
    pt: C.katalog.posttest.filter((t) => sesuaiTarget(t, p))
  };
}

async function simpanFotoAktivitas(p, tujuan, foto, meta) {

  const b = writeBatch(db);
  b.set(ref, Object.assign(snap(p), {

    gagalDeteksi: meta && meta.gagal ? meta.gagal : 0
  }));
  if (wajahBermasalah(meta)) b.set(doc(col("peringatan")), dokPeringatan(p, tujuan, meta, ref.id));
  await kirim(b);
  return ref.id;
}

/* Poin Organik TIDAK ditulis di sini — lihat blok "Organik: ringkasan wilayah (lazy rebuild)"
   di bawah. Dashboard Organik dihitung on-demand & di-cache 24 jam, bukan menumpang di tiap
   kejadian poin — supaya beban tulis tidak ikut membengkak seiring total aktivitas nasional. */
function tambahPoinKe(b, p, delta, ledgerId, tambahan) {
  const upd = Object.assign({ poinPeringkat: increment(delta), saldo: increment(delta), lastLedger: ledgerId }, tambahan || {});
  if (GRP_FIELD[p.group]) upd[GRP_FIELD[p.group]] = increment(delta); // group baru: cukup poinPeringkat
  b.update(doc(db, "petugas", p.id), upd);
}

/* Anti-curang tanpa server berbayar: jawaban dikunci dulu → baru kunci jawaban boleh dibaca
   → rules menghitung ulang jumlah benar dari jawaban terkunci × kunci asli. */
async function kunciJawaban(p, t, jawaban) {
  const ref = doc(db, "jawaban", t.id + "_" + p.id);
  const idx = (t.soal || []).map((q) => (jawaban && jawaban[q.id] != null ? jawaban[q.id] : -1));
  try {
    await setDoc(ref, { userId: p.id, testId: t.id, idx, waktu: nowIso() });
    return idx;
  } catch (e) {
    const ada = await getDoc(ref).catch(() => null);
    if (ada && ada.exists()) return ada.data().idx || [];
    throw e;
  }
}
async function jawabanTerkunci(tid, userId) {
  try {
    const d = await getDoc(doc(db, "jawaban", tid + "_" + userId));
    return d.exists() ? (d.data().idx || []) : null;
  } catch (e) { return null; }
}

async function submitPosttest(p, t, jawaban, fotoId, wajahFoto) {
  const w = nowIso();
  const idx = await kunciJawaban(p, t, jawaban);
  const kd = await getDoc(doc(db, "posttest_kunci", t.id));
  const kunci = kd.exists() ? (kd.data().kunci || []) : [];
  let benar = 0;
  const detail = (t.soal || []).map((q, i) => {
    const ok = idx[i] >= 0 && idx[i] === kunci[i];
    if (ok) benar++;
    return { soalId: q.id, soal: q.teks, jawaban: (q.opsi || [])[idx[i]] != null ? q.opsi[idx[i]] : "", kunci: (q.opsi || [])[kunci[i]] || "", benar: ok };
  });
  const total = detail.length;
  const poin = benar * POIN_PER_BENAR;
  const s = snap(p);
  const ledgerId = "pt_" + t.id + "_" + p.id;
  const b = writeBatch(db);
  b.set(doc(db, "hasil", t.id + "_" + p.id), Object.assign({}, s, {
    grupPeriode: p.group + "|" + s.periode, testId: t.id, judul: t.judul, detail, benar, total, poin, fotoId: fotoId || "", wajahFoto: wajahFoto || "", waktu: w
  }));
  b.set(doc(db, "ledger", ledgerId), Object.assign({}, s, {
    delta: poin, jenis: "posttest", ref: t.id, aktivitas: "Post Test " + t.judul + " — " + benar + " benar × " + POIN_PER_BENAR, waktu: w, oleh: "sistem"
  }));
  tambahPoinKe(b, p, poin, ledgerId, { ["ptHasil." + t.id]: { benar, total, poin, waktu: w } });
  await kirim(b);
  return { benar, total, poin, detail };
}

/* Dashboard TANPA bergantung pada hitungan server (count): pada 2026-10-09 count ditolak
   "Quota exceeded" padahal baca dokumen biasa masih jalan. Angka tim lapangan diambil dari cache
   ringkasan HQ (sama dengan Beranda Organik, 24 jam), status kecil (review/nonaktif/pending, Organik)
   dari daftar dokumennya langsung. Count hanya dipakai untuk respons kuesioner — kalau gagal tampil "–". */
async function loadAdminStats() {
  const per = periode();
  const cntAtauNull = (q) => getCountFromServer(q).then((r) => r.data().count).catch(() => null);
  const ambil = (q) => getDocs(q).then(rows).catch(() => null);
  const [hq, rv, nonaktifL, pendingL, respPer, grpResp, pt, prList, orgL, lp30] = await Promise.all([
    /* Hitung ulang nasional hanya kalau hasil terakhir >24 jam & tidak sedang dihitung di tab lain */
    perbaruiRingkasanNasional(false).catch(() => null).then((r) => r || bacaRingkasan("hq_NASIONAL")),
    ambil(query(col("petugas"), where("status", "==", "review"), limit(200))),
    ambil(query(col("petugas"), where("status", "==", "nonaktif"), limit(500))),
    ambil(query(col("redeem"), where("status", "==", "pending"), limit(300))),
    cntAtauNull(query(col("respons"), where("periode", "==", per))),
    Promise.all(GROUPS.map((g) => cntAtauNull(query(col("respons"), where("grupPeriode", "==", g + "|" + per))))),
    getAggregateFromServer(col("hasil"), { rata: average("benar"), soal: average("total") }).then((r) => r.data()).catch(() => ({ rata: null, soal: null })),
    ambil(query(col("peringatan"), where("status", "==", "baru"), limit(50))),
    FITUR.organik ? ambil(col("organik")) : Promise.resolve([]),
    /* Pindah HP mandiri 30 hari terakhir — biaya = jumlah pemindahan (kecil) */
    ambil(query(col("log_pindah"), where("waktu", ">=", new Date(Date.now() - 30 * 86400000))))
  ]);
  /* Petugas yang pindah HP mandiri >= 2x dalam 30 hari → kandidat joki */
  const hitPindah = {};
  (lp30 || []).filter((x) => x.cara === "mandiri").forEach((x) => { hitPindah[x.userId] = (hitPindah[x.userId] || 0) + 1; });
  C.adm.pindahCuriga = Object.keys(hitPindah).filter((id) => hitPindah[id] >= 2).map((id) => ({ id, n: hitPindah[id] })).sort((a, b) => b.n - a.n);
  const ada = (x) => x !== null && x !== undefined;
  const grup = hq && hq.grup ? hq.grup : null;
  const aktifG = GROUPS.map((g) => (grup && grup[g] ? grup[g].aktif || 0 : null));
  const aktif = grup ? aktifG.reduce((s, x) => s + (x || 0), 0) : null;
  const belum = grup ? GROUPS.reduce((s, g) => s + ((grup[g] ? grup[g].total - grup[g].aktif : 0) || 0), 0) : null;
  const review = rv ? rv.length : null, nonaktif = nonaktifL ? nonaktifL.length : null;
  const total = [aktif, belum, review, nonaktif].every(ada) ? aktif + belum + review + nonaktif : null;
  if (orgL) {
    const lv = { hq: 0, area: 0, regional: 0, branch: 0 };
    orgL.forEach((o) => { if (o.status === "aktif" && lv[o.level] !== undefined) lv[o.level]++; });
    C.adm.orgStats = { total: orgL.length, aktif: orgL.filter((o) => o.status === "aktif").length, review: orgL.filter((o) => o.status === "review").length, level: lv };
  } else C.adm.orgStats = { err: true };
  C.adm.ringkasanHq = hq;
  loadTeritori(null);
  const kuAktif = listOf(C.adm.kuesioner).filter((k) => k.aktif);
  const perGroup = GROUPS.map((g, i) => {
    const target = (aktifG[i] || 0) * Math.max(1, kuAktif.filter((k) => { const t = k.target || {}; return !t.group || t.group === "semua" || t.group === g; }).length);
    const isi = grpResp[i];
    return { g, anggota: aktifG[i], isi, target, pct: target && ada(isi) ? Math.round(isi / target * 100) : 0 };
  });
  const targetAll = perGroup.reduce((s, x) => s + x.target, 0);
  C.adm.reviewList = (rv || []).slice(0, 20);
  C.adm.peringatan = (prList || []).sort((a, b) => (b.waktu || "").localeCompare(a.waktu || "")).slice(0, 20);
  C.adm.organikReviewList = (orgL || []).filter((o) => o.status === "review").slice(0, 20);
  C.adm.stats = { total, aktif, review, belum, nonaktif, respPer, pending: pendingL ? pendingL.length : null, perGroup,
    peringatan: prList ? prList.length : null, organikReview: C.adm.organikReviewList.length,
    completion: ada(respPer) && targetAll ? Math.round(respPer / targetAll * 100) : null,
    rataBenar: pt.rata, rataSoal: pt.soal, topSalah: null, ringkasanPer: hq ? hq.diperbarui : null };
  render();
  loadSoalPalingSalah();
  /* Leaderboard kini ikut diperbarui bersama hitung ulang nasional harian (tanpa query terpisah) */

  /* Pastikan penanda versi katalog ada, supaya HP petugas bisa memakai cache katalog */

/* ---------- import petugas dari Excel ---------- */
async function muatSheetJS() {
  if (window.XLSX) return window.XLSX;
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res;
    s.onerror = () => rej(new Error("Gagal memuat pembaca Excel. Periksa koneksi internet."));
    document.head.appendChild(s);
  });
  return window.XLSX;
}

async function bacaFileImport(file) {
  const X = await muatSheetJS();
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  const adaUserId = (n) => ((X.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false })[0]) || [])
    .map((h) => String(h).trim().toLowerCase()).includes("user_id");
  const sheet = wb.SheetNames.find(adaUserId) || wb.SheetNames[0];
  return { sheet, data: X.utils.sheet_to_json(wb.Sheets[sheet], { defval: "", raw: true }) };
}

/* ---- upload soal massal: satu baris Excel = satu pertanyaan ---- */
async function bacaFileSoal(file) {
  const X = await muatSheetJS();
  const wb = X.read(await file.arrayBuffer(), { type: "array" });
  const adaSoal = (n) => ((X.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false })[0]) || [])
    .map((h) => String(h).trim().toLowerCase()).some((h) => ["pertanyaan", "soal", "teks"].includes(h));
  const sheet = wb.SheetNames.find(adaSoal) || wb.SheetNames[0];
  return { sheet, data: X.utils.sheet_to_json(wb.Sheets[sheet], { defval: "", raw: false }) };
}

const HURUF_KUNCI = { A: 0, B: 1, C: 2, D: 3, "1": 0, "2": 1, "3": 2, "4": 3 };

function siapkanSoal(data, tipe) {
  const isKu = tipe === "kuesioner";
  const maks = isKu ? MAKS_PERTANYAAN : MAKS_SOAL;
  const ambil = (r, keys) => {
    for (const k of Object.keys(r)) if (keys.includes(String(k).trim().toLowerCase())) return String(r[k] == null ? "" : r[k]).trim();
    return "";
  };
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const teks = ambil(r, ["pertanyaan", "soal", "teks", "question"]);
    const mentah = [1, 2, 3, 4].map((n) => ambil(r, ["opsi" + n, "opsi_" + n, "pilihan" + n, "jawaban" + n, ["a", "b", "c", "d"][n - 1]]));
    /* baris kosong di bawah data diabaikan, bukan dianggap salah */
    if (!teks && !mentah.some((o) => o)) return;
    const isi = mentah.map((o, n) => ({ o, n })).filter((x) => x.o);
    let alasan = "", kunci = 0;
    if (!teks) alasan = "pertanyaan kosong";
    else if (isi.length < 2) alasan = "minimal 2 opsi";
    else if (valid.length >= maks) alasan = "melebihi maksimal " + maks;
    else if (!isKu) {
      const kolom = HURUF_KUNCI[ambil(r, ["kunci", "kunci_jawaban", "jawaban_benar", "answer"]).toUpperCase()];
      if (kolom === undefined) alasan = "kunci harus diisi 1-4 atau A-D";
      else {
        kunci = isi.findIndex((x) => x.n === kolom);
        if (kunci < 0) alasan = "kunci menunjuk opsi yang kosong";
      }
    }
    if (alasan) { salah.push({ baris, teks, alasan }); return; }
    valid.push({ teks, opsi: isi.map((x) => x.o), kunci });
  });
  return { valid, salah };
}

/* ---- upload knowledge / hadiah / adjustment ---- */
function ambilKol(r, keys) {
  for (const k of Object.keys(r)) if (keys.includes(String(k).trim().toLowerCase())) return String(r[k] == null ? "" : r[k]).trim();
  return "";
}
const TIPE_KN = ["KV", "PDF", "VID", "DOC", "FAQ"];

function siapkanKnowledge(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const judul = ambilKol(r, ["judul", "nama", "materi", "title"]);
    const url = ambilKol(r, ["url", "link", "tautan"]);
    if (!judul && !url) return;
    const tipe = ambilKol(r, ["tipe", "jenis", "type"]).toUpperCase();
    const grp = ambilKol(r, ["group", "grup"]);
    let alasan = "";
    if (!judul) alasan = "judul kosong";
    else if (!url) alasan = "url kosong";
    else if (!/^https?:\/\//i.test(url)) alasan = "url harus diawali http:// atau https://";
    else if (valid.length >= MAKS_BARIS_UPLOAD.knowledge) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.knowledge;
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({
      judul, url, tipe: TIPE_KN.includes(tipe) ? tipe : "PDF",
      group: GROUPS.includes(grp) ? grp : "semua",
      area: ambilKol(r, ["area", "area_name"]), regional: ambilKol(r, ["regional", "regional_name"])
    });
  });
  return { valid, salah };
}

function siapkanHadiah(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const nama = ambilKol(r, ["nama", "hadiah", "nama_hadiah", "item"]);
    const poinRaw = ambilKol(r, ["poin", "point", "harga"]);
    if (!nama && !poinRaw) return;
    const poin = parseInt(poinRaw.replace(/[^\d-]/g, ""), 10);
    const stokRaw = ambilKol(r, ["stok", "stock", "kuota"]);
    let alasan = "";
    if (!nama) alasan = "nama hadiah kosong";
    else if (!(poin > 0)) alasan = "poin harus angka lebih dari 0";
    else if (valid.length >= MAKS_BARIS_UPLOAD.hadiah) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.hadiah;
    if (alasan) { salah.push({ baris, alasan }); return; }
    /* stok kosong atau tanda hubung = tak terbatas (-1) */
    const stok = !stokRaw || stokRaw === "-" ? -1 : Math.max(0, parseInt(stokRaw.replace(/[^\d]/g, ""), 10) || 0);
    valid.push({ nama, poin, stok });
  });
  return { valid, salah };
}

function siapkanAdjustment(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const id = ambilKol(r, ["user_id", "userid", "id", "id_digipos", "kode_sf", "username", "kode", "code"]);
    const poinRaw = ambilKol(r, ["poin", "point", "delta", "adjustment"]);
    const alasanKol = ambilKol(r, ["alasan", "keterangan", "catatan", "reason"]);
    if (!id && !poinRaw) return;
    const poin = parseInt(poinRaw.replace(/[^\d+-]/g, ""), 10);
    let alasan = "";
    if (!id) alasan = "ID / Username kosong";
    else if (!poin) alasan = "poin kosong atau nol";
    else if (!alasanKol) alasan = "alasan wajib diisi";
    else if (valid.length >= MAKS_BARIS_UPLOAD.adjustment) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.adjustment;
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({ baris, id, poin, alasan: alasanKol });
  });
  return { valid, salah };
}

/* Baris dobel (area+regional+branch+cluster sama persis) dengan Master Wilayah yang ada dilewati otomatis */
function siapkanWilayah(data) {
  const valid = [], salah = [];
  const kunci = new Set();
  data.forEach((r, i) => {
    const baris = i + 2;
    const area = ambilKol(r, ["area", "area_name", "nama_area"]);
    const regional = ambilKol(r, ["regional", "regional_name", "nama_regional"]);
    const branch = ambilKol(r, ["branch", "branch_name", "nama_branch"]);
    const cluster = ambilKol(r, ["cluster", "cluster_name", "nama_cluster"]);
    if (!area && !regional && !branch && !cluster) return;
    let alasan = "";
    if (!area || !regional || !branch || !cluster) alasan = "area/regional/branch/cluster harus lengkap semua";
    else if (valid.length >= MAKS_BARIS_UPLOAD.wilayah) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.wilayah;
    else {
      const k = [area, regional, branch, cluster].join("|");
      if (kunci.has(k)) alasan = "baris dobel dalam file";
      else kunci.add(k);
    }
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({ area, regional, branch, cluster });
  });
  return { valid, salah };
}

function siapkanImport(data, groupDefault) {
  const pick = (r, keys) => {
    for (const k of Object.keys(r)) if (keys.includes(String(k).trim().toLowerCase())) return String(r[k] == null ? "" : r[k]).trim();
    return "";
  };
  const valid = [], salah = [], ids = new Set(), kodes = new Set();
  data.forEach((r, i) => {
    const kode = normKode(pick(r, ["sf_code", "kode_sf", "user_id", "username", "kode", "code"]));
    const userId = kode;
    const idSf = normIdSf(pick(r, ["id_sf", "idsf", "sf_id"]));
    const cluster = pick(r, ["cluster_name", "cluster", "nama_cluster"]);
    const branch = pick(r, ["branch", "branch_name", "nama_branch"]);
    const regional = pick(r, ["regional", "region", "regional_name", "nama_regional"]);
    const area = pick(r, ["area_name", "area", "nama_area"]);
    const nama = pick(r, ["nama", "name", "nama_lengkap"]);
    const grp = pick(r, ["group", "grup"]);
    let alasan = "";
    if (!kode || /^(\(BLANK\)|GRAND TOTAL|0)$/.test(kode)) return; // sisa pivot / baris kosong dilewati diam-diam
    if (!KODE_RE.test(kode)) alasan = "format Kode SF tidak dikenali";
    else if (idSf && !ID_SF_RE.test(idSf)) alasan = "format ID SF tidak dikenali";
    else if (!cluster || !branch || !regional || !area) alasan = "wilayah tidak lengkap";
    else if (ids.has(userId)) alasan = "Kode SF dobel di file";
    if (alasan) { salah.push({ baris: i + 2, userId, kode, alasan }); return; }
    ids.add(userId); kodes.add(kode);
    valid.push({ userId, kode, idSf, nama, group: normGroup(grp) || groupDefault, area, regional, branch, cluster });
  });
  return { valid, salah };
}

async function jalankanImport(valid, log) {
  log("Membaca akun yang sudah ada…");
  const ada = new Map(); // id → ID SF yang tersimpan
  (await getDocs(col("petugas"))).forEach((d) => ada.set(d.id, d.data().idSf || ""));
  const baru = valid.filter((r) => !ada.has(r.userId));
  /* Akun lama yang di file punya ID SF baru/berbeda → HANYA field idSf yang diisi, data lain tidak disentuh */
  const isiIdSf = valid.filter((r) => ada.has(r.userId) && r.idSf && ada.get(r.userId) !== r.idSf);
  log(fmtNum(ada.size) + " akun sudah ada (dilewati), " + fmtNum(baru.length) + " akun baru akan dibuat" +
    (isiIdSf.length ? ", " + fmtNum(isiIdSf.length) + " akun lama diisi ID SF." : "."));
  const now = nowIso();
  for (let i = 0; i < baru.length; i += IMPORT_BATCH) {
    const b = writeBatch(db);
    baru.slice(i, i + IMPORT_BATCH).forEach((r) => {
      const d = {
        kode: r.kode, nama: r.nama || "", group: r.group, area: r.area, regional: r.regional, branch: r.branch, cluster: r.cluster,
        status: "belum_lengkap", sumber: "import", createdAt: now, poinPeringkat: 0, saldo: 0
      };
      if (GRP_FIELD[r.group]) d[GRP_FIELD[r.group]] = 0;
      if (r.idSf) d.idSf = r.idSf;
      b.set(doc(db, "petugas", r.userId), d);
    });
    await b.commit();
    log("Tersimpan " + fmtNum(Math.min(i + IMPORT_BATCH, baru.length)) + " / " + fmtNum(baru.length));
  }
  for (let i = 0; i < isiIdSf.length; i += IMPORT_BATCH) {
    const b = writeBatch(db);
    isiIdSf.slice(i, i + IMPORT_BATCH).forEach((r) => b.update(doc(db, "petugas", r.userId), { idSf: r.idSf }));
    await b.commit();
    log("ID SF terisi " + fmtNum(Math.min(i + IMPORT_BATCH, isiIdSf.length)) + " / " + fmtNum(isiIdSf.length));
  }
  /* Petugas baru → peta jembatan (diam kalau jembatan belum ada) */
  if (jembatanDb() && baru.length) { log("Memetakan akun baru ke jembatan…"); for (const r of baru) await tulisPeta(r.userId).catch(() => {}); }
  const k = (w) => [w.area, w.regional, w.branch, w.cluster].join("|");
  const peta = new Map();
  (C.wilayah || []).forEach((w) => peta.set(k(w), w));
  valid.forEach((r) => peta.set(k(r), { area: r.area, regional: r.regional, branch: r.branch, cluster: r.cluster }));
  const rowsW = Array.from(peta.values()).sort((a, b) => k(a).localeCompare(k(b)));
  await setDoc(doc(db, "master", "wilayah"), { rows: rowsW, updatedAt: nowIso() });
  C.wilayah = rowsW; C.wilayahLoaded = true;
  log("Master wilayah diperbarui: " + fmtNum(rowsW.length) + " cluster.");
  return { dibuat: baru.length, dilewati: valid.length - baru.length, idSfDiisi: isiIdSf.length, wilayah: rowsW.length };
}

async function cariUserId(input) {

  const d = await getDoc(doc(db, "petugas", kode));

function filterPetugas(f) {
  const cons = [];
  if (f.group) cons.push(where("group", "==", f.group));
  if (f.status) cons.push(where("status", "==", f.status));
  if (f.area) cons.push(where("area", "==", f.area));
  if (f.regional) cons.push(where("regional", "==", f.regional));
  if (f.branch) cons.push(where("branch", "==", f.branch));
  if (f.cluster) cons.push(where("cluster", "==", f.cluster));
  return cons;
}
