/* "DS", "direct sales", "BUD", "buddy" dst. → nama group resmi. Group tambahan Admin (mis. "Promotor")
   dikenali dari namanya, tanpa beda huruf besar/kecil & spasi. */
function normGroup(s) {
  const t = String(s || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  if (!t) return "";
  const persis = GROUPS.find((g) => g.toLowerCase().replace(/[^a-z0-9]/g, "") === t);
  if (persis) return persis;
  if ((t === "sf" || t.indexOf("salesforce") === 0) && GROUPS.includes("Sales Force")) return "Sales Force";
  return null;
}
function siapkanGroup(data) {
  const valid = [], salah = [];
  data.forEach((r, i) => {
    const baris = i + 2;
    const id = ambilKol(r, ["user_id", "userid", "id", "id_digipos", "kode_sf", "username", "kode", "code"]);
    const baruRaw = ambilKol(r, ["group_baru", "grup_baru", "group baru", "groupbaru", "new_group"]);
    if (!baruRaw) return; // tidak diisi = tidak diubah
    const baru = normGroup(baruRaw);
    let alasan = "";
    if (!id) alasan = "ID / Username kosong";
    else if (!baru) alasan = "group_baru \"" + baruRaw + "\" tidak dikenal (pakai " + GROUPS.join(" / ") + ")";
    else if (normGroup(ambilKol(r, ["group", "grup"])) === baru) return; // sama dengan group sekarang di file
    else if (valid.length >= MAKS_BARIS_UPLOAD.group) alasan = "melebihi maksimal " + MAKS_BARIS_UPLOAD.group;
    if (alasan) { salah.push({ baris, alasan }); return; }
    valid.push({ baris, id, group: baru });
  });
  return { valid, salah };
}
async function jalankanGroupMassal(rowsIn, log) {
  let berhasil = 0, sama = 0;
  const gagal = [];
  for (let i = 0; i < rowsIn.length; i++) {
    const r = rowsIn[i];
    try {
      const userId = await cariUserId(r.id);
      if (!userId) gagal.push({ baris: r.baris, alasan: "ID / Username tidak ditemukan" });
      else if (await ubahGroupPetugas(userId, r.group)) berhasil++;
      else sama++;
    } catch (e) { gagal.push({ baris: r.baris, alasan: e.message || "gagal menyimpan" }); }
    if ((i + 1) % 10 === 0 || i === rowsIn.length - 1) log(fmtNum(i + 1) + " dari " + fmtNum(rowsIn.length) + " baris diproses…");
  }
  return { berhasil, sama, gagal };
}

async function loadPetugasPage(reset) {
  const f = S.fPetugas, P = C.adm.petugas;
  const key = [f.group, f.status, f.area, f.regional, f.branch, f.cluster, f.q].join("|");
  if (reset || P.key !== key) { P.rows = []; P.cursor = null; P.habis = false; P.key = key; }
  if (P.habis || P.loading) return;
  P.loading = true; render();
  try {
    if (f.q.trim()) {
      const id = await cariUserId(f.q);
      const d = id ? await getDoc(doc(db, "petugas", id)) : null;
      P.rows = d && d.exists() ? [Object.assign({ id: d.id }, d.data())] : [];
      P.habis = true;
    } else {
      /* Semua filter di bawah adalah equality (==) murni: Firestore memakai index otomatis
         gabungan tanpa perlu composite index manual, selama tidak ada orderBy di field lain. */
      const cons = filterPetugas(f);
      if (P.cursor) cons.push(startAfter(P.cursor));
      cons.push(limit(HALAMAN));
      const qs = await getDocs(query(col("petugas"), ...cons));
      P.rows = P.rows.concat(rows(qs));
      P.cursor = qs.docs.length ? qs.docs[qs.docs.length - 1] : P.cursor;
      P.habis = qs.docs.length < HALAMAN;
    }
  } catch (e) { toast("no", "Gagal memuat data petugas: " + e.message); }
  P.loading = false; render();
}

/* Koreksi group salah input (mis. DS → Buddies). Poin per-group (pDS/pYPCR/pBUD) ikut dipindah ke
   field group baru supaya leaderboard group tetap benar; total poin & saldo tidak berubah.
   Riwayat aktivitas lama (respons/hasil/ledger) sengaja tidak diubah — itu snapshot saat kejadian. */
async function ubahGroupPetugas(userId, baru) {
  const d = await getDoc(doc(db, "petugas", userId));
  if (!d.exists()) throw new Error("Petugas tidak ditemukan.");
  const p = d.data();
  if (!GROUPS.includes(baru) || p.group === baru) return null;
  /* Group lama → field-nya dinolkan; group baru lama-format (DS/YPCR/BUD) → diisi poin group lama
     (atau total poin kalau asalnya group baru seperti Promotor). Group baru tanpa field: cukup ganti nama group. */
  const fLama = GRP_FIELD[p.group], fBaru = GRP_FIELD[baru];
  const upd = { group: baru, groupLama: p.group || "", groupDiubahAt: nowIso(), groupDiubahOleh: S.adminUser ? S.adminUser.email : "admin" };
  if (fBaru) upd[fBaru] = (p[fBaru] || 0) + (fLama ? p[fLama] || 0 : p.poinPeringkat || 0);
  if (fLama) upd[fLama] = 0;
  await updateDoc(doc(db, "petugas", userId), upd);
  return Object.assign({}, p, upd);
}

/* Welcoming Bonus versi Admin — untuk petugas daftar mandiri (saat disetujui) dan yang terlewat.
   Pakai ID ledger yang SAMA dengan jalur lengkapi profil ('wel_'+uid) dan dicek di dalam transaksi,
   jadi tiap orang maksimal dapat sekali walaupun tombolnya ditekan berkali-kali. Rules tidak perlu
   diubah: Admin memang boleh menulis petugas & ledger. */
const POIN_WELCOME = 100;
async function setujuiPetugas(userId) {
  return runTransaction(db, async (tx) => {
    const pRef = doc(db, "petugas", userId), lRef = doc(db, "ledger", "wel_" + userId);
    const [pd, ld, cd] = [await tx.get(pRef), await tx.get(lRef), await tx.get(doc(db, "petugas_cek", userId))];
    if (!pd.exists()) throw new Error("Petugas tidak ditemukan.");
    const oleh = S.adminUser ? S.adminUser.email : "admin";
    const p = Object.assign({ id: userId }, pd.data());
    /* SATU update ke dokumen petugas (status + poin bonus digabung) — jangan dua kali dalam satu transaksi */
    const upd = { status: "aktif", disetujuiAt: nowIso(), disetujuiOleh: oleh };
    const kasihBonus = !ld.exists();
    if (kasihBonus) {
      const lid = "wel_" + userId;
      tx.set(doc(db, "ledger", lid), Object.assign(snap(p), { delta: POIN_WELCOME, jenis: "welcome", ref: "", aktivitas: "Welcoming Bonus", waktu: nowIso(), oleh }));
      Object.assign(upd, { poinPeringkat: increment(POIN_WELCOME), saldo: increment(POIN_WELCOME), lastLedger: lid });
      if (GRP_FIELD[p.group]) upd[GRP_FIELD[p.group]] = increment(POIN_WELCOME);
    }
    tx.update(pRef, upd);
    if (cd.exists() && cd.data().nomor) tulisKontak(tx, p, String(cd.data().nomor).trim());
    return kasihBonus;
  });
}
/* Cadangan Setujui tanpa transaksi. Status aktif ditulis lebih dulu; bonus dicek dulu (wel_ sudah ada →
   dilewati) supaya tetap maksimal sekali; nomor ke kontak terakhir. Bonus/kontak gagal tidak membatalkan status. */
async function setujuiSederhana(userId) {
  const oleh = S.adminUser ? S.adminUser.email : "admin";
  await updateDoc(doc(db, "petugas", userId), { status: "aktif", disetujuiAt: nowIso(), disetujuiOleh: oleh });
  let bonus = false;
  try {
    const [pd, ld, cd] = await Promise.all([getDoc(doc(db, "petugas", userId)), getDoc(doc(db, "ledger", "wel_" + userId)), getDoc(doc(db, "petugas_cek", userId))]);
    const p = Object.assign({ id: userId }, pd.data());
    const b = writeBatch(db);
    if (!ld.exists() && p.group) { tulisWelcome(b, p, oleh); bonus = true; }
    if (cd.exists() && cd.data().nomor) tulisKontak(b, p, String(cd.data().nomor).trim());
    await b.commit();
  } catch (e) { bonus = false; }
  return bonus;
}
function tulisWelcome(tx, p, oleh) {
  const lid = "wel_" + p.id;
  tx.set(doc(db, "ledger", lid), Object.assign(snap(p), {
    delta: POIN_WELCOME, jenis: "welcome", ref: "", aktivitas: "Welcoming Bonus", waktu: nowIso(), oleh
  }));
  tambahPoinKe(tx, p, POIN_WELCOME, lid);
}
async function beriWelcome(userId) {
  return runTransaction(db, async (tx) => {
    const pRef = doc(db, "petugas", userId), lRef = doc(db, "ledger", "wel_" + userId);
    const [pd, ld] = [await tx.get(pRef), await tx.get(lRef)];
    if (!pd.exists() || ld.exists() || pd.data().status !== "aktif") return false;
    tulisWelcome(tx, Object.assign({ id: userId }, pd.data()), S.adminUser ? S.adminUser.email : "admin");
    return true;
  });
}
/* Cari petugas aktif yang belum punya ledger welcome: 1 query petugas aktif + 1 query ledger welcome,
   dicocokkan di memori (tanpa cek satu-satu). Sekali jalan saat tombol ditekan. */
async function cariBelumWelcome() {
  const [ps, ws] = await Promise.all([
    getDocs(query(col("petugas"), where("status", "==", "aktif"))),

  return rows(ps).filter((p) => !sudah.has(p.id));
}

/* ===== UNDUH DATA TIM ORGANIK (sejak 13 Okt 2026) =====
   Sumber: ringkasan per branch hasil CLOSING HARIAN (bukan koleksi petugas) → 1 read per branch
   dalam cakupan (Branch 1, Regional ±5–8, Area ±15–20, HQ ±61) + kontak per branch untuk
   Organik Branch/Regional. Branch yang sudah dibuka di layar tidak dibaca ulang.
   Data realtime hanya lewat Admin (Unduh Excel di Data Petugas). */
async function unduhTimOrganik() {
  const o = S.organikProfil, pratinjau = !!S.previewSebagai;
  const X = await muatSheetJS();
  /* Master Wilayah (1 read, biasanya sudah termuat di layar Masuk) hanya perlu untuk Area/HQ:
     memetakan branch → regional/area. Branch & Regional cukup dari profil sendiri. */
  if ((o.level === "area" || o.level === "hq") && !C.wilayahLoaded) await loadWilayah();
  let branches = o.level === "branch" ? [o.branch] : (o.cakupanBranch || []).slice();
  /* Cadangan kalau akun lama belum punya cakupanBranch: Regional dari rincian Beranda, Area/HQ dari Master Wilayah */
  if (!branches.length && o.level === "regional") branches = Object.keys((S.ringkasanOrg && S.ringkasanOrg.anak) || {});
  if (!branches.length && (o.level === "area" || o.level === "hq")) branches = (C.wilayah || []).filter((w) => o.level === "hq" || w.area === o.area).map((w) => w.branch);
  if (pratinjau) branches = Object.keys((S.ringkasanOrg && S.ringkasanOrg.anak) || {});
  branches = branches.filter((v, i, a) => v && a.indexOf(v) === i);
  if (!branches.length) throw new Error("Daftar branch di cakupan akun ini kosong. Hubungi Admin.");
  const lihatNomor = o.level === "branch" || o.level === "regional";
  S.orgNode = S.orgNode || {}; S.orgKontak = S.orgKontak || {};
  await Promise.all(branches.map(async (b) => {
    const tugas = [];
    if (!S.orgNode["branch_" + b]) tugas.push((pratinjau ? Promise.resolve(Object.assign(mockNodeOrganik("branch", b), { diperbarui: nowIso() })) : bacaRingkasan("branch_" + b))
      .then((d) => { S.orgNode["branch_" + b] = d || { kosong: true }; }));
    if (lihatNomor && S.orgKontak[b] === undefined) tugas.push((pratinjau ? Promise.resolve({ a: "0812-0000-0001" }) : getDoc(doc(db, "kontak", b)).then((d) => (d.exists() ? d.data().nomor || {} : {})))
      .then((m) => { S.orgKontak[b] = m; }).catch(() => { S.orgKontak[b] = {}; }));
    await Promise.all(tugas);
  }));
  const induk = {};
  (o.level === "area" || o.level === "hq" ? C.wilayah || [] : []).forEach((w) => { if (w.branch && !induk[w.branch]) induk[w.branch] = { area: w.area || "", regional: w.regional || "" }; });
  const data = [];
  let closing = "";
  branches.forEach((b) => {
    const d = S.orgNode["branch_" + b];
    if (!d || d.kosong) return;
    if (d.diperbarui && (!closing || d.diperbarui < closing)) closing = d.diperbarui;
    const km = (lihatNomor && S.orgKontak[b]) || {}, w = induk[b] || { area: o.area || "", regional: o.regional || "" };
    Object.keys(d.anggota || {}).forEach((id) => {
      const x = d.anggota[id];
      data.push([id, x.kode || "", x.nama || "", x.group || "", x.status === "aktif" ? "Sudah aktivasi" : "Belum aktivasi", x.poin || 0,
        w.area, w.regional, b, x.cluster || ""].concat(lihatNomor ? [km[id] || ""] : []));
    });
  });
  data.sort((a, b) => a[6].localeCompare(b[6]) || a[7].localeCompare(b[7]) || a[8].localeCompare(b[8]) || a[9].localeCompare(b[9]) || b[5] - a[5]);
  const tgl = closing ? fmtWaktu(closing) : "-";
  const isi = [
    ["DATA CLOSING HARIAN per " + tgl + " — BUKAN data realtime. Untuk data realtime, minta ke Admin DEBY."],
    ["Rahasia internal Telkomsel: jangan disebarkan di luar kebutuhan pemantauan tim."],
    [],
    ["user_id", "kode_sf", "nama", "group", "status", "poin", "area", "regional", "branch", "cluster"].concat(lihatNomor ? ["nomor_aktif"] : [])
  ].concat(data);
  const ws = X.utils.aoa_to_sheet(isi);
  ws["!cols"] = [12, 22, 26, 13, 15, 9, 20, 20, 20, 24, 16].map((w) => ({ wch: w }));
  ws["!autofilter"] = { ref: X.utils.encode_range({ s: { r: 3, c: 0 }, e: { r: 3 + data.length, c: lihatNomor ? 10 : 9 } }) };
  const wb = X.utils.book_new();
  X.utils.book_append_sheet(wb, ws, "tim");
  const wil = o.level === "hq" ? "NASIONAL" : o[o.level] || "";
  X.writeFile(wb, ("tim_" + o.level + "_" + wil + "_closing_" + (closing || nowIso()).slice(0, 10) + ".xlsx").replace(/[^\w.\-]+/g, "-"));
  return { baris: data.length, branch: branches.length, closing: tgl };
}

function opsiWilayah(level, d) {
  const out = [];
  C.wilayah.forEach((r) => {
    if (level === "area") out.push(r.area);
    else if (level === "regional" && r.area === d.area) out.push(r.regional);
    else if (level === "branch" && r.area === d.area && r.regional === d.regional) out.push(r.branch);
    else if (level === "cluster" && r.area === d.area && r.regional === d.regional && r.branch === d.branch) out.push(r.cluster);
  });
  return out.filter((v, i, a) => v && a.indexOf(v) === i).sort();
}

const ANAK_ORG = { hq: "area", area: "regional", regional: "branch", branch: "cluster" };
const LABEL_ANAK_ORG = { hq: "Area", area: "Regional", regional: "Branch", branch: "Cluster" };
function vOrganikHome() {
  const o = S.organikProfil, r = S.ringkasanOrg;
  /* LEVEL_LABEL berisi entitas HTML (&middot;) — jangan di-toUpperCase langsung, nanti jadi "&MIDDOT;" */
  const wilayah = o.level === "hq" ? "HQ &middot; NASIONAL" : esc(LEVEL_LABEL[o.level].toUpperCase() + " " + (o[o.level] || "").toUpperCase());
  const bulan = new Date().toLocaleDateString("id-ID", { month: "long", year: "numeric" }).toUpperCase();
  if (!r) return hero(wilayah, "Halo, " + esc(o.nama) + "!", "Memuat ringkasan wilayah&hellip;") + '<div class="pad"></div>';
  if (r.kosong) return hero(wilayah, "Halo, " + esc(o.nama) + "!", "") + '<div class="pad stack" style="margin-top:-14px;">' +
    '<div style="text-align:right;"><button class="btn btn-ghost btn-sm" data-do="keluarOrganik">Keluar</button></div>' +
    '<div class="card"><div class="empty">Ringkasan wilayah Anda belum tersedia. Data dihitung Admin sekali sehari &mdash; coba buka lagi nanti.</div></div></div>';
  const pct = (a, t) => (t ? Math.round((a / t) * 100) : 0);
  let tTotal = 0, tAktif = 0;
  Object.values(r.grup || {}).forEach((v) => { tTotal += v.total || 0; tAktif += v.aktif || 0; });
  const kartu = (lbl, n, sub) => '<div class="stat lift" style="padding:12px;"><div class="lbl">' + lbl + '</div>' +
    '<div class="n mono" style="font-size:22px;">' + n + "</div>" + (sub ? '<div class="k lbl" style="color:var(--ink-dim);">' + sub + "</div>" : "") + "</div>";
  const barisBar = (nama, aktif, total, ekor) => '<div style="margin-bottom:12px;">' +
    '<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;"><span style="font-weight:600;">' + esc(nama) + "</span>" +
    '<span class="mono" style="font-weight:700;">' + pct(aktif, total) + "%</span></div>" +
    '<div class="prog"><i style="width:' + pct(aktif, total) + '%;"></i></div>' +
    '<div style="font-size:12px;color:var(--ink-dim);margin-top:4px;">' + fmtNum(aktif) + " aktif / " + fmtNum(total) + ekor + "</div></div>";
  const grupHtml = Object.keys(r.grup || {}).map((g) => barisBar(g, r.grup[g].aktif || 0, r.grup[g].total || 0, "")).join("");
  /* Rincian ke level di bawahnya: HQ→Area, Area→Regional, Regional→Branch, Branch→Cluster.
     Diurutkan dari % aktivasi terendah supaya yang perlu didorong ada di atas. */
  const labelAnak = LABEL_ANAK_ORG[o.level];
  /* Rincian bertingkat sampai daftar nama: HQ→Area→Regional→Branch→nama, Area→Regional→Branch→nama,
     Regional→Branch→nama, Branch→Cluster→nama. Tiap tingkat yang dibuka = 1 read (cache ringkasan 24 jam).
     Nomor aktif hanya untuk Organik Branch & Regional (dokumen kontak, dijaga rules di server). */
  const lihatNomor = o.level === "branch" || o.level === "regional";
  const buka = S.orgBuka || {}, node = S.orgNode || {}, kontak = S.orgKontak || {};
  const daftarTim = (tim, branch) => {
    if (!tim.length) return '<div class="empty" style="padding:10px;">Belum ada anggota.</div>';
    const km = lihatNomor ? kontak[branch] : null;
    tim.sort((a, b) => (a.status === "aktif" ? 0 : 1) - (b.status === "aktif" ? 0 : 1) || (b.poin || 0) - (a.poin || 0) || (a.nama || "").localeCompare(b.nama || ""));
    return '<div style="border:1px solid var(--border);border-radius:11px;margin:4px 0 14px;padding:2px 10px;">' +
      (lihatNomor && km === undefined ? '<div class="lbl" style="padding:8px 0 0;">Memuat nomor&hellip;</div>' : "") + tim.map((x) => {
        const nomor = km && km[x.id];
        return '<div class="lb-row" style="padding:9px 0;' + (x.status === "aktif" ? "" : "opacity:.6;") + '"><div class="grow" style="min-width:0;">' +
          '<div class="lb-name" style="font-size:13px;">' + esc(x.nama || x.kode || "-") + "</div>" +
          '<div class="lb-sub">' + esc(x.group || "-") + " &middot; " + esc(x.kode || "-") + " &middot; " + (x.status === "aktif" ? "Sudah aktivasi" : "Belum aktivasi") + "</div>" +
          (nomor ? '<a class="mono" href="tel:' + esc(nomor.replace(/[^0-9+]/g, "")) + '" style="font-size:12.5px;color:var(--red);text-decoration:none;">&#9742; ' + esc(nomor) + "</a>" : "") +
          '</div><div class="lb-pts" style="font-size:13px;">' + fmtNum(x.poin || 0) + "</div></div>";
      }).join("") + "</div>";
  };
  const anggotaArr = (d) => Object.keys((d && d.anggota) || {}).map((id) => Object.assign({ id }, d.anggota[id]));
  const rincian = (level, d, dalam) => {
    const anakLv = ANAK_ORG[level];
    const items = Object.keys(d.anak || {}).map((n) => ({ nama: n, total: d.anak[n].total || 0, aktif: d.anak[n].aktif || 0 }))
      .sort((a, b) => pct(a.aktif, a.total) - pct(b.aktif, b.total) || b.total - a.total);
    if (!items.length) return '<div class="empty">Belum ada data.</div>';
    return items.map((a) => {
      const key = anakLv + ":" + a.nama, terbuka = !!buka[key];
      const keNama = anakLv === "cluster" || anakLv === "branch";
      let isi = "";
      if (terbuka) {
        if (anakLv === "cluster") isi = daftarTim(anggotaArr(d).filter((x) => (x.cluster || "(Tanpa cluster)") === a.nama), d.wilayah);
        else {
          const nd = node[anakLv + "_" + a.nama];
          isi = !nd ? '<div class="skel" style="margin:6px 0 12px;">Memuat&hellip;</div>'
            : nd.kosong ? '<div class="empty" style="padding:10px;">Belum tersedia &mdash; menunggu pembaruan harian Admin.</div>'
            : anakLv === "branch" ? daftarTim(anggotaArr(nd), a.nama)
            : '<div style="border-left:2px solid var(--border);padding-left:10px;margin:2px 0 14px;">' + rincian(anakLv, nd, true) + "</div>";
        }
      }
      return barisBar(a.nama, a.aktif, a.total, " dari total tim lapangan") +
        '<div style="margin:-6px 0 10px;"><button class="btn btn-ghost btn-sm" data-do="bukaTimOrg" data-v="' + esc(key) + '">' +
          (terbuka ? "Tutup" : keNama ? "Lihat daftar tim (" + fmtNum(a.total) + ")" : "Lihat per " + LABEL_ANAK_ORG[anakLv]) + "</button></div>" + isi;
    }).join("");
  };
  const anakHtml = rincian(o.level, r, false);
  return hero(wilayah + " &middot; " + bulan, "Halo, " + esc(o.nama) + "!", "") +
    '<div class="pad stack" style="margin-top:-14px;">' +
    '<div style="text-align:right;"><button class="btn btn-ghost btn-sm" data-do="keluarOrganik">Keluar</button></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">' +
      kartu("Total Tim Lapangan", fmtNum(tTotal), "") +
      kartu("Aktif", fmtNum(tAktif), pct(tAktif, tTotal) + "% sudah aktivasi") +
      kartu("Total Poin", fmtNum(r.total_poin || 0), "") + "</div>" +
    '<div class="card"><div class="card-title">Unduh Data Tim (Excel)</div>' +
      '<div class="note" style="margin-bottom:10px;"><b>Data yang diunduh adalah DATA CLOSING HARIAN</b> (per ' + (r.diperbarui ? fmtWaktu(r.diperbarui) : "-") + "), bukan realtime. " +
      "Kalau butuh data realtime, minta ke <b>Admin</b>.<br>Isi: Kode SF, nama, group, status aktivasi, poin, wilayah sampai cluster" + (lihatNomor ? ", nomor aktif" : "") + ".</div>" +
      '<button class="btn btn-primary btn-block" data-do="unduhTimOrg" ' + (S.orgUnduhBusy ? "disabled" : "") + ">" + (S.orgUnduhBusy ? "Menyiapkan file&hellip;" : "&#8681; Unduh Excel Tim") + "</button></div>" +
    '<div class="sec-head"><h2>Aktivasi per Group</h2></div>' +
    '<div class="card">' + grupHtml + "</div>" +
    '<div class="sec-head"><h2>Per ' + labelAnak + "</h2></div>" +
    '<div class="card">' + anakHtml + "</div>" +
    '<div class="note" style="text-align:center;">Diperbarui sekali sehari &middot; data per ' + (r.diperbarui ? fmtWaktu(r.diperbarui) : "-") + "</div>" +
    "</div>";
}

function kartuTugas(tipe, d, hasil) {
  const isKu = tipe === "kuesioner";

    const sub = isKu ? "Selesai &middot; lengkap &middot; +" + POIN_KUESIONER + " poin" : "Selesai &middot; " + hasil.benar + "/" + hasil.total + " benar &middot; +" + hasil.poin + " poin";

/* ===== Knowledge (mockup "Knowledge — tampilan petugas", 12 Okt 2026) =====
   0 reads tambahan: materi ikut cache katalog; status "sudah dibuka" disimpan di HP (localStorage, per akun). */
const KN_BARU_HARI = 7;
function kunciKnDibuka() { return "kn_dibuka_" + (S.me || ""); }
function knDibuka() { return cacheAmbil(kunciKnDibuka()) || {}; }
function tandaiKnDibuka(id) { const m = knDibuka(); m[id] = 1; cacheSimpan(kunciKnDibuka(), m); }
function knowledgeSaya() {
  const p = S.profilSaya;
  if (!p) return [];
  return (C.katalog.knowledge || []).filter((k) => { const t = k.target || {}; return (!t.group || t.group === "semua" || t.group === p.group) && (!t.area || t.area === p.area) && (!t.regional || t.regional === p.regional); })
    .sort((a, b) => (b.dibuat || "").localeCompare(a.dibuat || ""));
}
function knBaru(k) { return !!k.dibuat && jamSejak(k.dibuat) < KN_BARU_HARI * 24; }
function knBaruBelumDibuka() { if (!FITUR.knowledge) return []; const d = knDibuka(); return knowledgeSaya().filter((k) => knBaru(k) && !d[k.id]); }
function domainDari(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function ketKn(k) {
  const t = k.target || {};
  const tempat = t.regional ? "Regional " + t.regional : t.area ? "Area " + t.area : (k.dibuat ? fmtTgl(k.dibuat) : "");
  return [domainDari(k.url), tempat].filter(Boolean).map(esc).join(" &middot; ");
}
function kartuKn(k, dibuka) {
  const tipe = (k.tipe || "DOC").toUpperCase();
  return '<button class="kn" data-do="bukaKn" data-v="' + esc(k.id) + '"><span class="kt t-' + esc(tipe) + '">' + esc(tipe) + "</span>" +
    '<span class="grow" style="min-width:0;"><span class="kn-n">' + esc(k.judul) + '</span><span class="kn-s">' + ketKn(k) + "</span></span>" +
    '<span class="kdot' + (dibuka ? " off" : "") + '" title="' + (dibuka ? "Sudah dibuka" : "Belum dibuka") + '"></span></button>';
}
function vKnowledge() {
  const semua = knowledgeSaya();
  if (!semua.length) return '<div class="hero"><h1>Knowledge</h1></div><div class="pad"><div class="card" style="text-align:center;padding:40px 18px;">' +
    '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="color:var(--ink-faint);" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>' +
    '<div style="font-weight:700;font-size:16px;margin-top:12px;">Belum ada materi untuk kamu</div>' +
    '<div class="note" style="margin-top:6px;">Materi dari tim program akan muncul di sini. Kami kabari di Beranda kalau ada yang baru.</div>' +
    '<button class="btn btn-ghost" style="margin-top:16px;" data-do="tab" data-v="home">Kembali ke Beranda</button></div></div>';
  const dib = knDibuka();
  const sudah = semua.filter((k) => dib[k.id]).length;
  const q = (S.knCari || "").trim().toLowerCase(), f = S.knTipe || "semua";
  const tipes = ["semua"].concat(TIPE_KN.filter((t) => semua.some((k) => (k.tipe || "DOC").toUpperCase() === t)));
  const cocok = semua.filter((k) => (f === "semua" || (k.tipe || "DOC").toUpperCase() === f) && (!q || (k.judul || "").toLowerCase().indexOf(q) >= 0));
  const baru = cocok.filter(knBaru), lain = cocok.filter((k) => !knBaru(k));

/* Tabel Group × Area, klik Area untuk turun ke Regional. Sel = aktif / total · % */
function vTeritori() {
  const T = C.adm.teritori;
  const judul = '<div class="sec-head"><h2>Sudah Aktivasi per Group &times; Teritori</h2><span class="lbl">jumlah petugas aktif</span></div>';
  if (!T || !T.area) return judul + (T && T.err ? '<div class="err">Gagal menghitung: ' + esc(T.err) + "</div>" : '<div class="skel">Menghitung&hellip;</div>');
  const sel = (v, tebal) => '<td class="mono" style="font-size:13px;' + (tebal ? "font-weight:700;" : "") + '">' + fmtNum(v.aktif) + "</td>";
  const baris = (nama, d, gaya, aksi) => {
    const tot = { aktif: 0 };
    const sels = GROUPS.map((g) => { const v = (d && d[g]) || { aktif: 0 }; tot.aktif += v.aktif; return sel(v); }).join("");
    return '<tr style="' + gaya + '"><td>' + aksi + esc(nama) + "</td>" + sels + sel(tot, true) + "</tr>";
  };
  const semua = {};
  let isi = "";
  Object.keys(T.area).sort().forEach((a) => {
    GROUPS.forEach((g) => { const v = T.area[a][g]; semua[g] = semua[g] || { aktif: 0 }; semua[g].aktif += v.aktif; });
    const buka = !!T.buka[a];
    isi += baris(a, T.area[a], "cursor:pointer;font-weight:600;", "<span>" + (buka ? "&#9662; " : "&#9656; ") + "</span>")
      .replace("<tr ", '<tr data-do="bukaTeritori" data-v="' + esc(a) + '" ');
    if (buka) {
      const reg = T.regional[a];
      isi += !reg ? '<tr><td colspan="5"><div class="skel" style="margin:4px 0 4px 18px;">Menghitung regional&hellip;</div></td></tr>'
        : Object.keys(reg).sort().map((r) => baris(r, reg[r], "background:var(--surface-2);font-size:13px;", '<span style="display:inline-block;width:18px;"></span>')).join("");
    }
  });
  isi += baris("Total Nasional", semua, "font-weight:700;border-top:2px solid var(--border-strong);", "");
  return judul + (T.err ? '<div class="err" style="margin-bottom:10px;">' + esc(T.err) + "</div>" : "") +
    '<div class="tbl-wrap" style="margin-bottom:6px;"><table><thead><tr><th>Teritori</th>' + GROUPS.map((g) => "<th>" + esc(g) + "</th>").join("") + "<th>Total</th></tr></thead><tbody>" + isi + "</tbody></table></div>" +
    '<div class="note" style="margin-bottom:18px;">Klik baris Area untuk melihat per Regional. Real-time, dihitung di server saat Dashboard dibuka.</div>';
}

/* Empat dropdown berjenjang: Area menyempit ke Regional, lalu Branch, lalu Cluster.
   Semua exact-match, dipetakan dari Master Wilayah yang sudah dimuat gratis di memori. */
function pilihWilayahFilter(prefix, f) {
  const uniq = (arr) => arr.filter((v, i, a) => a.indexOf(v) === i).sort();
  const cocok = (w, sd) => (!f.area || w.area === f.area) && (sd < 1 || !f.regional || w.regional === f.regional) && (sd < 2 || !f.branch || w.branch === f.branch);
  const areas = uniq(C.wilayah.map((w) => w.area));
  const regs = uniq(C.wilayah.filter((w) => cocok(w, 0)).map((w) => w.regional));
  const branches = uniq(C.wilayah.filter((w) => cocok(w, 1)).map((w) => w.branch));
  const clusters = uniq(C.wilayah.filter((w) => cocok(w, 2)).map((w) => w.cluster));
  const opt = (arr, val, semua) => '<option value="">' + semua + "</option>" + arr.map((x) => '<option value="' + esc(x) + '" ' + (val === x ? "selected" : "") + ">" + esc(x) + "</option>").join("");
  return '<select data-in="' + prefix + '.area">' + opt(areas, f.area, "Semua Area") + "</select>" +
    '<select data-in="' + prefix + '.regional">' + opt(regs, f.regional, "Semua Regional") + "</select>" +
    '<select data-in="' + prefix + '.branch">' + opt(branches, f.branch, "Semua Branch") + "</select>" +
    '<select data-in="' + prefix + '.cluster">' + opt(clusters, f.cluster, "Semua Cluster") + "</select>";
}

/* Baris satu node wilayah (Area/Regional/Branch) di panel Ringkasan — total & aktif dijumlahkan
   dari semua group sekaligus, sesuai isi ringkasan cache-nya. */
function wnodeBaris(level, value, childLevel, childList, buka, indent) {
  const key = level + "_" + value;
  const d = C.adm.ringkasanWilayah[key];
  const grup = d && d.grup ? d.grup : null;
  const total = grup ? Object.values(grup).reduce((s, g) => s + (g.total || 0), 0) : null;
  const aktif = grup ? Object.values(grup).reduce((s, g) => s + (g.aktif || 0), 0) : null;
  let html = '<div class="wnode" style="' + (indent ? "margin-left:0;" : "") + '">' +
    '<div class="wnode-h ' + (buka ? "on" : "") + '" data-do="' + (level === "area" ? "bukaAreaAdm" : "bukaRegionalAdm") + '" data-v="' + esc(value) + '">' +
      '<span class="wc">&#9656;</span><span class="wnode-nama">' + esc(value) + "</span>" +
      '<span class="wnode-n">' + (d ? fmtNum(aktif) + "/" + fmtNum(total) : "&hellip;") + "</span>" +
    "</div>";
  if (buka) {
    html += '<div class="wnode-kids">' +
      (!childList.length ? '<div class="empty" style="padding:6px 0;font-size:12px;">Tidak ada ' + (childLevel === "regional" ? "regional" : "branch") + ".</div>" :
        childList.map((v) => childLevel === "regional"
          ? wnodeBaris("regional", v, "branch", S.wilayahBuka.regional === v ? anakWilayah("branch", "regional", v) : [], S.wilayahBuka.regional === v, true)
          : branchBaris(v)).join("")) +
      "</div>";
  }
  return html + "</div>";
}
function branchBaris(value) {
  const d = C.adm.ringkasanWilayah["branch_" + value];
  const grup = d && d.grup ? d.grup : null;
  const total = grup ? Object.values(grup).reduce((s, g) => s + (g.total || 0), 0) : null;
  const aktif = grup ? Object.values(grup).reduce((s, g) => s + (g.aktif || 0), 0) : null;
  return '<div class="wnode-h" style="cursor:default;"><span class="wc" style="visibility:hidden;">&#9656;</span>' +
    '<span class="wnode-nama" style="font-weight:400;">' + esc(value) + "</span>" +
    '<span class="wnode-n">' + (d ? fmtNum(aktif) + "/" + fmtNum(total) : "&hellip;") + "</span></div>";
}

  const areas = C.wilayah.map((w) => w.area).filter((v, i, a) => v && a.indexOf(v) === i).sort();

/* ---------- target & jadwal ---------- */
function pilihTarget(prefix, t) {
  const areas = C.wilayah.map((w) => w.area).filter((v, i, a) => a.indexOf(v) === i).sort();
  const regs = C.wilayah.filter((w) => !t.area || w.area === t.area).map((w) => w.regional).filter((v, i, a) => a.indexOf(v) === i).sort();
  return '<select data-in="' + prefix + '.group"><option value="semua">Semua Group</option>' + GROUPS.map((g) => "<option " + (t.group === g ? "selected" : "") + ">" + esc(g) + "</option>").join("") + "</select>" +
    '<select data-in="' + prefix + '.area"><option value="">Semua Area</option>' + areas.map((a) => '<option value="' + esc(a) + '" ' + (t.area === a ? "selected" : "") + ">" + esc(a) + "</option>").join("") + "</select>" +
    '<select data-in="' + prefix + '.regional"><option value="">Semua Regional</option>' + regs.map((r) => '<option value="' + esc(r) + '" ' + (t.regional === r ? "selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>";
}
function ringkasTarget(x) {
  const t = x.target || {};
  const bag = [(!t.group || t.group === "semua") ? "semua group" : t.group];
  if (t.area) bag.push(t.area);
  if (t.regional) bag.push(t.regional);
  return bag.map(esc).join(" &middot; ");
}
function ringkasJadwal(x) {
  if (!x.mulai && !x.selesai) return "tanpa batas waktu";
  return (x.mulai ? esc(x.mulai) : "sekarang") + " s/d " + (x.selesai ? esc(x.selesai) : "seterusnya");
}

function kartuModul(m, tipe) {
  const isKu = tipe === "kuesioner";
  const items = isKu ? (m.pertanyaan || []) : (m.soal || []);
  const buka = S.openQ === tipe + ":" + m.id;
  const d = S.draftSoal;
  const terkunci = !isKu && (C.adm.peserta[m.id] || 0) > 0;
  let html = '<div class="card" style="margin-bottom:14px;"><div class="row" style="flex-wrap:wrap;">' +
    '<div class="grow"><div style="font-weight:800;font-size:16px;">' + esc(m.judul) + "</div>" +
    '<div class="lbl" style="color:var(--ink-dim);">' + items.length + " " + (isKu ? "pertanyaan" : "soal") + " &middot; " + ringkasTarget(m) + " &middot; " + ringkasJadwal(m) + "</div></div>" +
    '<span class="pill ' + (m.aktif ? "pill-good" : "pill-neutral") + '" style="cursor:pointer;" data-do="toggleAktif" data-t="' + tipe + '" data-v="' + m.id + '">' + (m.aktif ? "Aktif" : "Nonaktif") + "</span>" +
    '<button class="btn btn-ghost btn-sm" data-do="bukaSoal" data-t="' + tipe + '" data-v="' + m.id + '">' + (buka ? "Tutup" : "Kelola " + (isKu ? "Pertanyaan" : "Soal")) + "</button>" +
    '<button class="btn btn-danger btn-sm" data-do="hapusModul" data-t="' + tipe + '" data-v="' + m.id + '">Hapus</button></div>';
  if (buka) {
    const kunci = C.adm.kunci[m.id] || [];
    html += '<div style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">' +
      (!items.length ? '<div class="empty" style="padding:14px;">Belum ada ' + (isKu ? "pertanyaan" : "soal") + ".</div>" : items.map((q, i) =>
        '<div class="card" style="background:var(--surface-2);margin-bottom:10px;"><div class="row"><div class="grow" style="font-weight:700;font-size:14px;">' + (i + 1) + ". " + esc(q.teks) + "</div>" +
        (terkunci ? "" : '<button class="btn btn-danger btn-sm" data-do="hapusSoal" data-t="' + tipe + '" data-m="' + m.id + '" data-v="' + q.id + '">Hapus</button>') + "</div>" +
        '<ul style="margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-dim);">' +
        (q.opsi || []).map((o, oi) => { const k = !isKu && kunci[i] === oi; return "<li" + (k ? ' style="color:var(--good);font-weight:700;"' : "") + ">" + esc(o) + (k ? " &mdash; kunci" : "") + "</li>"; }).join("") + "</ul></div>").join("")) +
      (terkunci ? '<div class="note">Sudah ada ' + fmtNum(C.adm.peserta[m.id]) + " peserta &mdash; soal dikunci supaya penilaian tetap konsisten. Buat post test baru untuk materi baru.</div>" :
        kartuUploadSoal(m, tipe, isKu) +
        '<div class="card" style="background:var(--surface-2);"><div class="card-title">Tambah satu ' + (isKu ? "Pertanyaan" : "Soal (maks " + MAKS_SOAL + ")") + "</div>" +
        '<div class="field"><label>Pertanyaan</label><input type="text" value="' + esc(d.teks) + '" data-in="draftSoal.teks"></div>' +
        [0, 1, 2, 3].map((i) => '<div class="field" style="margin-top:9px;"><label>Opsi ' + (i + 1) + (!isKu && d.kunci === i ? " (kunci)" : "") + '</label><div class="row">' +
          (isKu ? "" : '<input type="radio" name="kunci" ' + (d.kunci === i ? "checked" : "") + ' data-do="setKunci" data-v="' + i + '" style="width:auto;flex:none;">') +
          '<input type="text" class="grow" value="' + esc(d.opsi[i]) + '" data-in="draftSoal.opsi.' + i + '"></div></div>').join("") +
        '<button class="btn btn-primary btn-sm" style="margin-top:12px;" data-do="tambahSoal" data-t="' + tipe + '" data-v="' + m.id + '">Tambah</button>' +
        (isKu ? "" : '<div class="note" style="margin-top:10px;">Pilih radio di sebelah opsi untuk menandai kunci. Kunci disimpan terpisah dan tidak bisa dibaca petugas sebelum menjawab.</div>') + "</div>") +
      "</div>";
  }
  return html + "</div>";
}

/* Admin mengoreksi level & wilayah Organik (mis. yang ngaku HQ padahal Branch). Cakupan dihitung
   ulang dari Master Wilayah, jadi aksesnya langsung menyempit/melebar sesuai wilayah baru. */
function editorWilayahOrg(o) {
  const e = S.editOrg;
  if (!e || e.email !== o.email) return '<button class="btn btn-ghost btn-sm btn-block" style="margin-bottom:12px;" data-do="mulaiEditOrg">Ubah Level &amp; Wilayah</button>';
  const sel = (nama, label, opsi, aktif) => '<div class="field" style="margin-top:9px;"><label>' + label + '</label><select data-in="editOrg.' + nama + '" ' + (aktif ? "" : "disabled") + ">" +
    '<option value="">' + (aktif ? "Pilih " + label : "Pilih induk dulu") + "</option>" +
    opsi.map((x) => '<option value="' + esc(x) + '" ' + (e[nama] === x ? "selected" : "") + ">" + esc(x) + "</option>").join("") + "</select></div>";
  let f = "";
  if (e.level !== "hq") f += sel("area", "Area", opsiWilayah("area", e), true);
  if (e.level === "regional" || e.level === "branch") f += sel("regional", "Regional", e.area ? opsiWilayah("regional", e) : [], !!e.area);
  if (e.level === "branch") f += sel("branch", "Branch", e.regional ? opsiWilayah("branch", e) : [], !!e.regional);
  const siap = e.level === "hq" || !!e[e.level];
  const c = siap ? hitungCakupan(e.level, e.level === "hq" ? "NASIONAL" : e[e.level]) : null;
  return '<div class="card" style="background:var(--surface-2);margin-bottom:12px;"><div class="card-title">Ubah Level &amp; Wilayah</div>' +
    '<div class="seg">' + Object.keys(LEVEL_LABEL).map((lv) => '<button class="' + (e.level === lv ? "on" : "") + '" data-do="setLevelEditOrg" data-v="' + lv + '">' + LEVEL_LABEL[lv].split(" ")[0] + "</button>").join("") + "</div>" +
    f +
    (c ? '<div class="note" style="margin-top:10px;">Cakupan baru: ' + c.cakupanArea.length + " area &middot; " + c.cakupanRegional.length + " regional &middot; " + c.cakupanBranch.length + " branch</div>" : "") +
    '<div class="row" style="margin-top:10px;"><button class="btn btn-primary btn-sm" data-do="simpanWilayahOrg"' + (siap ? "" : " disabled") + ">Simpan</button>" +
    '<button class="btn btn-ghost btn-sm" data-do="batalEditOrg">Batal</button></div></div>';
}

/* Cakupan leaderboard yang sedang dipilih: null = Nasional (sumber publik/leaderboard, tak berubah),
   atau {level, value} kalau Admin sedang menyempitkan ke Area/Regional (sumber: ringkasan, dipakai
   bareng Organik & panel Ringkasan Wilayah — tidak ada query baru sama sekali). */
function cakupanLb() {
  if (S.lbWilayah.regional) return { level: "regional", value: S.lbWilayah.regional };
  if (S.lbWilayah.area) return { level: "area", value: S.lbWilayah.area };
  return null;
}
function pilihWilayahLb() {
  const areas = C.wilayah.map((w) => w.area).filter((v, i, a) => v && a.indexOf(v) === i).sort();
  const regs = S.lbWilayah.area ? C.wilayah.filter((w) => w.area === S.lbWilayah.area).map((w) => w.regional).filter((v, i, a) => v && a.indexOf(v) === i).sort() : [];
  return '<select data-in="lbWilayah.area"><option value="">Nasional (semua Area)</option>' +
      areas.map((a) => '<option value="' + esc(a) + '" ' + (S.lbWilayah.area === a ? "selected" : "") + ">" + esc(a) + "</option>").join("") + "</select>" +
    '<select data-in="lbWilayah.regional" ' + (S.lbWilayah.area ? "" : "disabled") + '><option value="">Semua Regional di Area ini</option>' +
      regs.map((r) => '<option value="' + esc(r) + '" ' + (S.lbWilayah.regional === r ? "selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>";
}

function kartuWelcome() {
  const w = C.adm.welcome;
  let isi;
  if (!w) isi = '<button class="btn btn-ghost btn-sm" data-do="cekWelcome">Cek siapa yang belum dapat</button>';
  else if (w.loading) isi = '<div class="skel">Mengecek&hellip;</div>';
  else if (!w.list.length) isi = '<div class="note">Semua petugas aktif sudah mendapat Welcoming Bonus.</div> <button class="btn btn-ghost btn-sm" data-do="cekWelcome">Cek ulang</button>';
  else if (w.jalan) isi = '<div class="note">Memproses ' + w.selesai + " / " + w.list.length + "&hellip; jangan tutup halaman.</div>" +
    '<div class="prog"><i style="width:' + Math.round((w.selesai / w.list.length) * 100) + '%;"></i></div>';
  else isi = '<div class="note" style="margin-bottom:10px;"><b>' + fmtNum(w.list.length) + " petugas aktif</b> belum mendapat Welcoming Bonus:</div>" +
    '<div class="tbl-wrap" style="max-height:260px;overflow:auto;margin-bottom:10px;"><table><thead><tr><th>ID</th><th>Nama</th><th>Group</th><th>Asal</th></tr></thead><tbody>' +
    w.list.map((p) => '<tr><td class="mono">' + esc(p.id) + "</td><td>" + esc(p.nama || "—") + "</td><td>" + grpTag(p.group) + '</td><td style="font-size:12px;color:var(--ink-dim);">' + (p.sumber === "daftar" ? "Daftar mandiri" : "Import") + "</td></tr>").join("") +
    "</tbody></table></div>" +
    '<button class="btn btn-primary btn-sm" data-do="beriWelcomeSemua">Beri +' + POIN_WELCOME + " ke " + fmtNum(w.list.length) + " petugas</button>";
  return '<div class="card" style="margin-bottom:18px;"><div class="card-title">Welcoming Bonus Terlewat</div>' +
    '<div class="note" style="margin-bottom:10px;">Petugas daftar mandiri kini otomatis dapat +' + POIN_WELCOME + " saat Anda klik Setujui. Untuk yang sudah aktif sebelumnya, cek &amp; beri di sini. Kebal dobel: tiap orang maksimal sekali.</div>" + isi + "</div>";
}

function aPoin() {
  const d = S.draftAdj;
  const chips = [["semua", "Semua"]].concat(GROUPS.map((g) => [g, g]));
  const cak = cakupanLb();
  let dataLb, judulLb, waktuLb;
  if (!cak) {
    dataLb = C.lb ? (C.lb[S.lbFilter] || []) : null;
    judulLb = "Nasional"; waktuLb = C.lb && C.lb.diperbarui ? fmtWaktu(C.lb.diperbarui) : null;
  } else {
    const r = C.adm.ringkasanWilayah[cak.level + "_" + cak.value];
    dataLb = r ? (S.lbFilter === "semua" ? gabungTopGrup(r.topGrup).slice(0, 20) : (r.topGrup[S.lbFilter] || [])) : null;
    judulLb = cak.value; waktuLb = r ? fmtWaktu(r.diperbarui) : null;
  }
  return head("Poin &amp; Leaderboard", "Point ledger &middot; semua perubahan poin tercatat untuk audit") +
    '<div class="card" style="margin-bottom:18px;"><div class="card-title">Manual Adjustment</div><div class="filters">' +
      '<input type="text" class="mono" placeholder="ID / Username" value="' + esc(d.id) + '" data-in="draftAdj.id" style="min-width:170px;">' +
      '<input type="number" placeholder="Poin (+/-)" value="' + esc(d.poin) + '" data-in="draftAdj.poin" style="min-width:120px;">' +
      '<input type="text" placeholder="Alasan (wajib)" value="' + esc(d.alasan) + '" data-in="draftAdj.alasan" style="flex:1;min-width:220px;">' +
      '<button class="btn btn-primary btn-sm" data-do="manualAdj">Catat</button></div>' +
      '<div class="note" style="margin-top:10px;">Wajib mencatat alasan; admin pelaksana tercatat otomatis. Mempengaruhi saldo dan leaderboard.</div></div>' +
    kartuUploadUmum("adjustment", "Upload Adjustment Poin dari Excel", "user_id, poin, alasan",
      "Kolom user_id boleh diisi Kode SF atau Username. Poin boleh minus, misalnya <span class=\"mono\">-25</span>. Semua baris tercatat di ledger dengan alasannya. Diproses satu per satu, jadi file besar butuh waktu.") +
    kartuWelcome() +
    '<div class="sec-head"><h2>Leaderboard &mdash; Top 20 &middot; ' + esc(judulLb) + '</h2><button class="btn btn-ghost btn-sm" data-do="perbaruiLb">Perbarui sekarang</button></div>' +
    '<div class="filters" style="margin-bottom:10px;">' + pilihWilayahLb() + "</div>" +
    '<div class="lbl" style="margin-bottom:10px;">' + (waktuLb ? "Diperbarui " + waktuLb : "Belum pernah diperbarui") +
      (cak ? ' &middot; cache 24 jam, dipakai bareng dashboard Organik' : "") + "</div>" +
    '<div class="chips" style="margin-bottom:12px;">' + chips.map((c) => '<button class="chip ' + (S.lbFilter === c[0] ? "on" : "") + '" data-do="lbFilter" data-v="' + esc(c[0]) + '">' + esc(c[1]) + "</button>").join("") + "</div>" +
    '<div class="card" style="margin-bottom:18px;">' + ((cak ? !C.adm.ringkasanWilayah[cak.level + "_" + cak.value] : (C.lbLoading || !dataLb)) ? '<div class="skel">Memuat&hellip;</div>' : barisLb(dataLb, null)) + "</div>" +
    '<div class="sec-head"><h2>Point Ledger &mdash; 50 Terbaru</h2><button class="btn btn-ghost btn-sm" data-do="refreshLedger">Muat ulang</button></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Waktu</th><th>ID</th><th>Nama</th><th>Aktivitas</th><th>In/Out</th><th>Oleh</th></tr></thead><tbody>' +
    (!C.adm.ledgerLoaded ? '<tr><td colspan="6"><div class="skel">Memuat&hellip;</div></td></tr>' : !C.adm.ledger.length ? '<tr><td colspan="6"><div class="empty">Belum ada transaksi.</div></td></tr>' :
      C.adm.ledger.map((l) => '<tr><td class="mono" style="font-size:12px;">' + fmtWaktu(l.waktu) + '</td><td class="mono">' + esc(l.userId) + "</td><td>" + esc(l.nama || l.kode) + "</td><td>" + esc(l.aktivitas) + "</td>" +
        '<td class="mono" style="font-weight:700;color:' + (l.delta >= 0 ? "var(--good)" : "var(--bad)") + ';">' + (l.delta >= 0 ? "+" : "") + l.delta + '</td><td style="font-size:12px;color:var(--ink-dim);">' + esc(l.oleh || "sistem") + "</td></tr>").join("")) +
    "</tbody></table></div>";
}

      hadiah.map((h) => '<tr><td style="font-weight:600;">' + esc(h.nama) + '</td><td class="mono">' + fmtNum(h.poin) + '</td><td class="mono">' + (h.stok === -1 ? "&infin;" : fmtNum(h.stok)) + "</td>" +

      C.adm.redeem.map((r) => {

          (r.wajah && r.wajah !== "ok" ? '<span class="pill pill-warn">&#9888; wajah tidak terdeteksi</span>' : "") +

          (r.status === "pending" ? '<button class="btn btn-ok btn-sm" data-do="setujuiRedeem" data-v="' + r.id + '">Setujui</button><button class="btn btn-danger btn-sm" data-do="tolakRedeem" data-v="' + r.id + '">Tolak</button>' : "") +
          "</div>";

}

function render() {
  const root = document.getElementById("app");
  let html;
  if (S.mode === "admin") {
    html = !S.adminUser ? vAdmLogin() : !S.adminCek ? layarMuat("Memeriksa akses admin&hellip;") : !S.adminOk ? vAdmBelum() : S.previewSebagai ? vPreviewShell() : vAdmin();
  } else if (S.view === "boot") html = layarMuat("Membuka DEBY&hellip;");
  else if (S.view === "daftar") html = vDaftar();
  else if (S.view === "admLogin") html = vAdmLogin();
  else if (S.view === "masukOrganik") html = vMasukOrganik();
  else if (S.view === "daftarOrganik") html = vDaftarOrganik();
  else if (S.view === "organikApp") {
    html = !S.organikProfil ? layarMuat("Memuat akun&hellip;")
      : S.organikProfil.status !== "aktif" ? vOrganikTunggu()
      : vShellOrganik(S.organikTab === "panduan" ? vPanduan("organik") : vOrganikHome());
  }
  else if (S.view === "pindahHp") html = vPindahHp();
  else if (S.view === "dipindah") html = vDipindah();
  else if (!S.me || S.view === "masuk") html = vMasuk();
  else if (!S.profilSaya) html = layarMuat("Memuat akun&hellip;");
  else if (S.profilSaya.status === "belum_lengkap") html = vLengkapi();
  else if (S.view === "gate" && S.gate) html = vShell(vGate());
  else if (S.view === "run" && S.run) html = vShell(vRun());
  else if (S.view === "hasil" && S.hasil) html = vShell(vHasil());
  else {
    const fn = { home: vHome, tugas: vTugas, leaderboard: vLeaderboard, knowledge: vKnowledge, hadiah: vHadiah, poin: vPoin, profil: vProfil, bantuan: vBantuan }[S.tab] || vHome;
    html = vShell(fn());
  }
  if (S.toast) html += '<div class="toast ' + (S.toast.kind === "ok" ? "ok" : S.toast.kind === "no" ? "no" : "") + '">' + esc(S.toast.msg) + "</div>";
  if (S.modal) html += S.modal;

  /* pertahankan fokus & posisi kursor saat render ulang */
  const a = document.activeElement;
  const keep = a && a.getAttribute && a.getAttribute("data-in");
  const selStart = keep && typeof a.selectionStart === "number" ? a.selectionStart : null;
  root.innerHTML = html;
  if (keep) {
    const el = root.querySelector('[data-in="' + keep + '"]');
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  }
}

  "username-dipakai": "Kode SF ini sudah dipakai akun lain. Periksa kembali, atau hubungi Admin."
};
function pesanMasuk(e) {
  if (e && PESAN_MASUK[e.kode]) return PESAN_MASUK[e.kode];
  if (e && String(e.code || "").indexOf("auth/") === 0) return "Login perangkat belum aktif di sistem. Hubungi Admin.";
  if (e && e.code === "permission-denied") return "Data ditolak server. Periksa kembali isianmu.";
  return "Gagal: " + esc(e && e.message ? e.message : e);
}

const PESAN_MASUK_ORG = Object.assign({}, PESAN_MASUK, {
  "format-id": "Email wajib diisi.",
  "username-kosong": "NIK Telkomsel wajib diisi.",
  "tidak-terdaftar": "Email belum terdaftar. Pilih <b>Daftar sebagai Tim Internal</b> di bawah.",
  "username-salah": "NIK tidak cocok dengan email tersebut.",
  "sudah-terdaftar": "Email ini sudah terdaftar. Kembali ke layar Masuk dan pakai NIK &amp; Email.",
  "hp-akun-lain": "HP/browser ini sudah terhubung ke akun Organik lain. Satu HP hanya untuk satu akun.",
  "terikat-hp-lain": "Akun ini sudah terhubung ke HP atau browser lain. Kalau memang ganti HP, minta Admin menekan <b>Reset HP</b> di data Organik-mu.",
  "slot-penuh": "Akun ini sudah terhubung ke 3 perangkat (maksimal). Untuk memakai perangkat baru, minta Admin menekan <b>Reset HP</b> di data Organik-mu, lalu masuk ulang dari perangkat yang akan dipakai.",
  "slot-kunci": "Sudah 3x salah memasukkan NIK hari ini untuk menambah perangkat. Coba lagi besok, atau hubungi Admin.",
  "slot-ditolak": "NIK tidak cocok dengan email tersebut, perangkat ini belum ditambahkan."
});
function pesanMasukOrg(e) {
  if (e && e.kode === "slot-ditolak") return PESAN_MASUK_ORG["slot-ditolak"] + (e.sisa > 0 ? " Sisa " + e.sisa + "x percobaan hari ini." : " Percobaan hari ini sudah habis.");
  if (e && PESAN_MASUK_ORG[e.kode]) return PESAN_MASUK_ORG[e.kode];
  return pesanMasuk(e);
}

  async mulaiPindah() {
    const bp = S.masuk.bisaPindah;
    if (!bp) return;
    S.pindah = { userId: bp.userId, kode: bp.kode, idSf: bp.idSf || "", step: "cek", digit: "", setuju: false, err: "", busy: false };
    S.view = "pindahHp"; render();
    try {
      const j = await statusJedaPindah(bp.userId);
      Object.assign(S.pindah, { terakhir: j.terakhir, bisaLagi: j.bisaLagi, step: j.masihJeda ? "jeda" : "verif" });
    } catch (e) { Object.assign(S.pindah, { step: "verif" }); }
    render();
  },
  pindahSetuju() { if (S.pindah) { S.pindah.setuju = !S.pindah.setuju; render(); } },
  pindahBatal() { S.pindah = null; S.view = "masuk"; render(); },
  async pindahKirim() {
    const s = S.pindah;
    if (!s || s.busy) return;
    const d = String(s.digit || "").replace(/\D/g, "");
    if (d.length !== 4) { s.err = "Masukkan tepat 4 digit angka."; return render(); }
    if (!s.setuju) { s.err = "Centang pernyataan pemilik akun terlebih dahulu."; return render(); }
    s.busy = true; s.err = ""; render();
    try {
      await pindahHpMandiri(s.userId, s.kode, d, s.idSf);
      Object.assign(s, { busy: false, step: "ok", bisaLagi: tambahHariIso(nowIso(), PINDAH_TULISAN_HARI) });
      cacheSimpan("cekhp_" + s.userId, Date.now());
    } catch (e) {
      s.busy = false;
      if (e.kode === "pindah-kunci") s.step = "kunci";
      else if (e.kode === "pindah-ditolak") {
        /* Bisa karena 4 digit salah, atau masih dalam jeda — cek ulang jeda supaya pesannya tepat */
        let j = null; try { j = await statusJedaPindah(s.userId); } catch (x) {}
        if (j && j.masihJeda) Object.assign(s, { step: "jeda", terakhir: j.terakhir, bisaLagi: j.bisaLagi });
        else { s.err = "4 digit tidak cocok dengan nomor aktif yang terdaftar." + (e.sisa > 0 ? " Sisa percobaan hari ini: " + e.sisa + "." : " Percobaan hari ini habis."); s.digit = ""; if (!(e.sisa > 0)) s.step = "kunci"; }
      } else s.err = pesanMasuk(e);
    }
    render();
  },
  pindahSelesai() { const id = S.pindah && S.pindah.userId; S.pindah = null; S.masuk = { id: "", idSf: "", username: "", err: "", info: "", busy: false }; if (id) mulaiSesi(id); },

  async masuk() {
    const m = S.masuk;
    if (m.busy) return;
    m.err = ""; m.info = ""; m.bisaPindah = null; m.busy = true; render();
    try {
      const userId = await masukPetugas(m.id, m.id, m.idSf);
      S.masuk = { id: "", idSf: "", username: "", err: "", info: "", busy: false };
      mulaiSesi(userId);
    } catch (e) {
      m.busy = false;
      m.err = pesanMasuk(e);
      /* ID & username benar tapi terikat HP lain → tawarkan pindah HP mandiri */
      if (e.kode === "terikat-hp-lain") m.bisaPindah = { userId: normUserId(m.id), kode: normKode(m.id), idSf: normIdSf(m.idSf) };
      if (e.kode === "tidak-terdaftar") { S.daftar.userId = normUserId(m.id); S.daftar.kode = normKode(m.id); }
      render();
    }
  },

  async daftar() {
    const d = S.daftar;
    const err = (t) => { d.err = t; render(); };
    if (d.busy) return;
    if (d.nama.trim().length < 2) return err("Nama lengkap wajib diisi.");
    if (namaTidakWajar(d.nama)) return err(namaTidakWajar(d.nama));
    if (!d.group) return err("Pilih group.");
    if (!KODE_RE.test(normKode(d.userId))) return err("Format Kode SF tidak sesuai.");
    d.kode = normKode(d.userId);
    if (d.idSf && !ID_SF_RE.test(normIdSf(d.idSf))) return err("Format ID SF tidak sesuai.");
    if (!d.nomor.trim()) return err("Nomor aktif wajib diisi.");
    if (!d.area || !d.regional || !d.branch || !d.cluster) return err("Lengkapi 4 data wilayah.");
    if (!d.foto) return err("Foto petugas wajib diambil.");
    d.busy = true; d.err = ""; render();
    try {
      const userId = await daftarBaru(d);
      kaitSetelahDaftar(userId).catch(() => {});
      S.daftar = { nama: "", group: "", userId: "", kode: "", idSf: "", nomor: "", area: "", regional: "", branch: "", cluster: "", foto: null, err: "", busy: false };
      mulaiSesi(userId);
      toast("ok", "Terdaftar. Akunmu menunggu verifikasi Admin.");
    } catch (e) { d.busy = false; err(pesanMasuk(e)); }
  },

  async mulai(v, el) {
    if (S.previewSebagai) return toast("", "Mode pratinjau: mengerjakan tugas sungguhan dinonaktifkan.");
    const t = el.getAttribute("data-t");
    if (!bolehBeraktivitas()) return toast("no", "Akun belum diverifikasi Admin.");
    if (t === "kuesioner" && sudahKuesioner(v)) return toast("no", "Kuesioner ini sudah kamu isi.");
    if (t === "posttest" && hasilPosttest(v)) return toast("no", "Post test ini sudah kamu kerjakan.");
    const modul = C.katalog[t].find((x) => x.id === v);
    if (!modul) return toast("no", "Modul tidak ditemukan. Tekan Muat ulang.");
    if (t === "posttest" && (await jawabanTerkunci(v, S.me))) {
      /* jawaban sudah terkunci tapi nilai belum tersimpan — lanjutkan penilaian, tidak mengulang */
      try {
        const h = await submitPosttest(S.profilSaya, modul, null, null);
        S.hasil = Object.assign({ tipe: "posttest" }, h); S.view = "hasil"; render();
        loadSaya(S.me); loadRank(true);
      } catch (e) { toast("no", pesanGagal(e, "Gagal melanjutkan penilaian")); }
      return;
    }
    S.gate = { tujuan: t, refId: v, foto: null, busy: false }; S.view = "gate"; render();
  },
  mulaiRedeem(v) {
    if (S.previewSebagai) return toast("", "Mode pratinjau: penukaran hadiah sungguhan dinonaktifkan.");
    if (!bolehBeraktivitas()) return toast("no", "Akun belum diverifikasi Admin.");
    S.gate = { tujuan: "redeem", refId: v, foto: null, busy: false }; S.view = "gate"; render();
  },
  gateBatal() { S.gate = null; S.view = "app"; render(); },

  async gateLanjut() {
    const g = S.gate, p = S.profilSaya;
    if (!g || !g.foto || g.busy) return;
    g.busy = true; render();
    try {
      if (g.tujuan === "redeem") {
        const h = C.hadiah[g.refId];
        if (!h) throw new Error("Hadiah tidak ditemukan.");
        if (redeemBulanIniSaya().length) throw new Error("Kuota penukaran bulan ini sudah dipakai.");
        if (tersediaSaya() < h.poin) throw new Error("Poin tidak cukup.");
        if (h.stok !== -1 && h.stok <= 0) throw new Error("Stok habis.");
        const fotoId = await simpanFotoAktivitas(p, "redeem", g.foto, g.wajah);
        await ajukanRedeem(p, g.refId, h, fotoId, g.wajah ? g.wajah.status : "tidak_dicek");
        S.gate = null; S.view = "app"; S.tab = "hadiah";
        loadSaya(S.me); loadHadiah(true);
        return toast("ok", "Permintaan terkirim. Poin ditahan sampai Admin menyetujui.");
      }
      const modul = C.katalog[g.tujuan].find((x) => x.id === g.refId);
      if (!modul) throw new Error("Modul tidak ditemukan.");
      const fotoId = await simpanFotoAktivitas(p, g.tujuan, g.foto, g.wajah);
      S.run = { tipe: g.tujuan, doc: modul, idx: 0, jawaban: {}, fotoId, wajah: g.wajah ? g.wajah.status : "tidak_dicek", busy: false };
      S.gate = null; S.view = "run"; render();
    } catch (e) { if (S.gate) S.gate.busy = false; toast("no", pesanGagal(e, "Gagal")); }
  },

  runBack() { const r = S.run; if (!r) return; if (r.idx === 0) { S.run = null; S.view = "app"; return render(); } r.idx--; render(); },
  async runNext() {
    const r = S.run;
    if (!r || r.busy) return;
    const items = r.tipe === "kuesioner" ? r.doc.pertanyaan : r.doc.soal;
    if (r.idx < items.length - 1) { r.idx++; return render(); }
    r.busy = true; render();
    try {
      if (r.tipe === "kuesioner") { await submitKuesioner(S.profilSaya, r.doc, r.jawaban, r.fotoId, r.wajah); S.hasil = { tipe: "kuesioner" }; }
      else { const h = await submitPosttest(S.profilSaya, r.doc, r.jawaban, r.fotoId, r.wajah); S.hasil = Object.assign({ tipe: "posttest" }, h); }
      S.run = null; S.view = "hasil"; render();
      loadSaya(S.me); loadRank(true);
    } catch (e) { r.busy = false; toast("no", pesanGagal(e, "Gagal mengirim")); }
  },

  async simpanProfil() {
    const nomor = S.profil.nomor.trim();
    if (!nomor) return toast("no", "Isi nomor aktif yang baru.");
    try {
      await setDoc(doc(db, "petugas_cek", S.me), { nomor }, { merge: true });
      const p = S.profilSaya;
      if (p && p.status === "aktif") { try { const k = writeBatch(db); tulisKontak(k, p, nomor); await k.commit(); } catch (e) {} }
      S.profil.nomor = ""; toast("ok", "Nomor aktif diperbarui.");
    }
    catch (e) { toast("no", pesanGagal(e, "Gagal menyimpan")); }
  },

  async bukaTimOrg(v) {
    /* v = "level:nama" — level anak yang dibuka (area/regional/branch/cluster) */
    S.orgBuka = S.orgBuka || {}; S.orgNode = S.orgNode || {}; S.orgKontak = S.orgKontak || {};
    S.orgBuka[v] = !S.orgBuka[v];
    render();
    const o = S.organikProfil;
    if (!S.orgBuka[v] || !o) return;
    const i = v.indexOf(":"), lv = v.slice(0, i), nama = v.slice(i + 1);
    const lihatNomor = o.level === "branch" || o.level === "regional";
    const branchKontak = lv === "branch" ? nama : lv === "cluster" ? o.branch : null;
    const tugas = [];
    if (lv !== "cluster" && !S.orgNode[lv + "_" + nama]) {
      tugas.push((S.previewSebagai ? Promise.resolve(mockNodeOrganik(lv, nama)) : bacaRingkasan(lv + "_" + nama).then((d) => d || { kosong: true }))
        .then((d) => { S.orgNode[lv + "_" + nama] = d; })
        .catch((e) => { S.orgBuka[v] = false; toast("no", pesanGagal(e, "Gagal memuat")); }));
    }
    if (lihatNomor && branchKontak && S.orgKontak[branchKontak] === undefined) {
      tugas.push((S.previewSebagai ? Promise.resolve({ a: "0812-0000-0001" }) : getDoc(doc(db, "kontak", branchKontak)).then((d) => (d.exists() ? d.data().nomor || {} : {})))
        .then((m) => { S.orgKontak[branchKontak] = m; })
        .catch(() => { S.orgKontak[branchKontak] = {}; }));
    }
    if (!tugas.length) return;
    await Promise.all(tugas);
    render();
  },

    if (d.mulai && d.selesai && d.mulai > d.selesai) return toast("no", "Tanggal selesai harus setelah tanggal mulai.");
    const data = { judul: d.judul.trim(), target: { group: d.group || "semua", area: d.area || "", regional: d.regional || "" }, mulai: d.mulai || "", selesai: d.selesai || "", aktif: false, createdAt: nowIso() };
    data[modulField(t)] = [];
    try {
      const ref = doc(collection(db, t));
      const b = writeBatch(db);
      b.set(ref, data);
      if (t === "posttest") b.set(doc(db, "posttest_kunci", ref.id), { kunci: [] });
      await b.commit();
      if (t === "posttest") { C.adm.kunci[ref.id] = []; C.adm.peserta[ref.id] = 0; }
      S.draftModul[t] = kosongModul();
      S.openQ = t + ":" + ref.id; S.draftSoal = { teks: "", opsi: ["", "", "", ""], kunci: 0 };

  async tambahSoal(v, el) {
    const t = el.getAttribute("data-t"), d = S.draftSoal;
    if (!d.teks.trim()) return toast("no", "Pertanyaan wajib diisi.");
    const idx = [0, 1, 2, 3].filter((i) => d.opsi[i].trim());
    if (idx.length < 2) return toast("no", "Minimal 2 opsi.");
    const item = { id: uid(), teks: d.teks.trim(), opsi: idx.map((i) => d.opsi[i].trim()) };
    const cur = C.adm[t][v];
    const daftarItem = (cur[modulField(t)] || []).concat([item]);
    try {
      if (t === "posttest") {
        const k = idx.indexOf(d.kunci);
        if (k < 0) return toast("no", "Kunci jawaban harus opsi yang terisi.");
        if (daftarItem.length > MAKS_SOAL) return toast("no", "Maksimal " + MAKS_SOAL + " soal per post test.");
        if ((C.adm.peserta[v] || 0) > 0) return toast("no", "Sudah ada peserta, soal tidak bisa diubah.");
        const kunci = (C.adm.kunci[v] || []).concat([k]);
        const b = writeBatch(db);
        b.update(doc(db, "posttest", v), { soal: daftarItem });
        b.set(doc(db, "posttest_kunci", v), { kunci });
        await b.commit();
        C.adm.kunci[v] = kunci;
      } else {
        await updateDoc(doc(db, "kuesioner", v), { pertanyaan: daftarItem });
      }
      if (cur.aktif) jadwalkanRebuildKatalog();
      S.draftSoal = { teks: "", opsi: ["", "", "", ""], kunci: 0 };
      toast("ok", "Ditambahkan.");

/* ============ kamera depan + deteksi wajah ============ */
let faceapiMod = null, faceapiJanji = null;
function siapkanDeteksiWajah() {
  if (faceapiJanji) return faceapiJanji;
  faceapiJanji = (async () => {
    const f = await import(FACEAPI_BASE + "/dist/face-api.esm.js");
    try { await f.tf.setBackend("webgl"); } catch (e) {}
    await f.tf.ready();
    await f.nets.tinyFaceDetector.loadFromUri(FACEAPI_BASE + "/model/");
    /* pemanasan: inferensi pertama lambat karena kompilasi shader, jangan dibebankan ke saat jepret */
    const c = document.createElement("canvas"); c.width = 160; c.height = 120;
    await f.detectAllFaces(c, new f.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: DETEKSI.skorMin }));
    faceapiMod = f;
    return f;
  })().catch((e) => { faceapiJanji = null; throw e; });
  return faceapiJanji;
}

const K = { el: null, stream: null, tujuan: null, gagal: 0, hasil: null };
const JUDUL_KAMERA = { daftar: "Foto Referensi", lengkapi: "Foto Referensi", gate: "Verifikasi Wajah", profil: "Ganti Foto Referensi" };
const PESAN_POSISI = "Posisikan wajah di dalam bingkai, lalu tekan <b>Ambil Foto</b>.";

function kPesan(t, jenis) { const m = K.el && K.el.querySelector(".cam-msg"); if (m) { m.innerHTML = t; m.className = "cam-msg" + (jenis ? " " + jenis : ""); } }
function kTombol(nama, tampil, aktif) {
  const b = K.el && K.el.querySelector('[data-k="' + nama + '"]');
  if (!b) return;
  b.hidden = !tampil;
  if (aktif !== undefined) b.disabled = !aktif;
}

async function bukaKamera(tujuan) {
  tutupKamera();
  K.tujuan = tujuan; K.gagal = 0; K.hasil = null;
  K.el = document.createElement("div");
  K.el.className = "cam-overlay";
  K.el.innerHTML = '<div class="cam-top"><b>' + esc(JUDUL_KAMERA[tujuan] || "Foto Wajah") + '</b><button class="cam-x" data-k="batal">Tutup</button></div>' +
    '<div class="cam-frame"><video playsinline muted autoplay></video><img class="cam-still" alt="" hidden><div class="cam-guide"></div></div>' +
    '<div class="cam-msg">Menyalakan kamera depan&hellip;</div>' +
    '<div class="cam-actions"><button class="btn btn-primary btn-block" data-k="jepret" disabled>Ambil Foto</button>' +
    '<button class="btn btn-block cam-sec" data-k="ulang" hidden>Ulangi</button>' +
    '<button class="btn btn-block cam-warn" data-k="paksa" hidden>Kirim tetap (ditandai untuk Admin)</button></div>';
  document.body.appendChild(K.el);
  K.el.addEventListener("click", kameraKlik);

  const deteksi = siapkanDeteksiWajah().then(() => true).catch(() => false);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return kPesan("Browser ini tidak bisa membuka kamera langsung. Buka DEBY dari <b>Chrome</b> di HP.", "bad");
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { exact: "user" }, width: { ideal: 720 }, height: { ideal: 960 } } });
  } catch (e) {
    const n = e && e.name;
    return kPesan(n === "NotAllowedError" ? "Izin kamera ditolak. Di Chrome, ketuk ikon di samping alamat situs &rarr; izinkan <b>Kamera</b>, lalu coba lagi."
      : n === "OverconstrainedError" || n === "NotFoundError" ? "Kamera depan tidak ditemukan. Foto harus diambil dari HP."
      : "Kamera tidak bisa dibuka. Buka DEBY dari <b>Chrome</b> di HP.", "bad");
  }
  if (!K.el) { stream.getTracks().forEach((t) => t.stop()); return; }
  K.stream = stream;
  const track = stream.getVideoTracks()[0];
  const setelan = track && track.getSettings ? track.getSettings() : {};
  if (setelan.facingMode && setelan.facingMode !== "user") { tutupKamera(); return toast("no", "Hanya kamera depan yang boleh dipakai."); }
  const v = K.el.querySelector("video");
  v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  kPesan("Menyiapkan pendeteksi wajah&hellip; (unduhan &plusmn;1,5 MB, hanya sekali)");
  const ok = await deteksi;
  if (!K.el) return;
  kPesan(ok ? PESAN_POSISI : "Pendeteksi wajah gagal dimuat. Foto tetap bisa diambil dan akan ditandai untuk dicek Admin.", ok ? "" : "warn");
  kTombol("jepret", true, true);
}

function tutupKamera() {
  if (K.stream) { K.stream.getTracks().forEach((t) => t.stop()); K.stream = null; }
  if (K.el) { K.el.remove(); K.el = null; }
}

function jepretFrame() {
  const v = K.el.querySelector("video");
  const ukuran = K.tujuan === "gate" ? FOTO_AKTIVITAS : FOTO_BASELINE;
  const s = Math.min(1, ukuran.dim / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return { canvas: c, url: c.toDataURL("image/jpeg", ukuran.q) };
}

async function periksaWajah(canvas) {
  if (!faceapiMod) return { status: "tidak_dicek", skor: null };
  const det = await faceapiMod.detectAllFaces(canvas, new faceapiMod.TinyFaceDetectorOptions({ inputSize: DETEKSI.inputSize, scoreThreshold: DETEKSI.skorMin }));
  if (!det.length) return { status: "gagal", alasan: "Wajah tidak terdeteksi. Pastikan wajahmu terlihat jelas, tidak tertutup, dan cahaya cukup." };
  if (det.length > 1) return { status: "gagal", alasan: "Terdeteksi lebih dari satu wajah. Foto harus berisi wajahmu saja." };
  if (det[0].box.width / canvas.width < DETEKSI.rasioMin) return { status: "gagal", alasan: "Wajah terlalu jauh. Dekatkan HP ke wajahmu." };
  return { status: "ok", skor: +det[0].score.toFixed(2) };
}

async function kameraKlik(e) {
  const b = e.target.closest("[data-k]");
  if (!b || !K.el) return;
  const aksi = b.getAttribute("data-k");
  if (aksi === "batal") return tutupKamera();
  const v = K.el.querySelector("video"), still = K.el.querySelector(".cam-still");
  if (aksi === "ulang") {
    still.hidden = true; v.hidden = false; K.hasil = null;
    kTombol("ulang", false); kTombol("paksa", false); kTombol("jepret", true, true);
    return kPesan(PESAN_POSISI);
  }
  if (aksi === "paksa") {
    if (K.hasil) terimaFoto(K.hasil, { status: "tidak_terdeteksi", gagal: K.gagal, skor: null });
    return;
  }
  if (aksi !== "jepret" || !v.videoWidth) return;
  kTombol("jepret", true, false);
  const shot = jepretFrame();
  still.src = shot.url; still.hidden = false; v.hidden = true;
  kPesan("Memeriksa wajah&hellip;");
  let cek;
  try { cek = await periksaWajah(shot.canvas); } catch (err) { cek = { status: "tidak_dicek", skor: null }; }
  if (!K.el) return;
  if (cek.status === "ok" || cek.status === "tidak_dicek") {
    return terimaFoto(shot.url, { status: cek.status, gagal: K.gagal, skor: cek.skor != null ? cek.skor : null });
  }
  K.gagal++;
  K.hasil = shot.url;
  const habis = K.gagal >= DETEKSI.maksGagal;
  kPesan(cek.alasan + (habis ? "<br><b>Sudah " + K.gagal + "x gagal.</b> Kamu boleh mengirim foto ini dengan tanda peringatan untuk dicek Admin." : " (percobaan " + K.gagal + " dari " + DETEKSI.maksGagal + ")"), "bad");
  kTombol("jepret", false);
  kTombol("ulang", true, true);
  kTombol("paksa", habis, true);
}

function terimaFoto(url, meta) {
  const t = K.tujuan;
  tutupKamera();
  if (t === "daftar") { S.daftar.foto = url; S.daftar.wajah = meta; }
  else if (t === "lengkapi") { S.lengkapi.foto = url; S.lengkapi.wajah = meta; }
  else if (t === "gate" && S.gate) { S.gate.foto = url; S.gate.wajah = meta; }
  else if (t === "profil") { S.profil.foto = url; S.profil.wajah = meta; }
  render();
  if (meta.status !== "ok") toast("", "Foto akan dikirim dengan tanda peringatan untuk Admin.");
}

/* ============ event ============ */
const root = document.getElementById("app");
root.addEventListener("click", (e) => {
  const el = e.target.closest("[data-do]");
  if (!el) return;
  if (el.classList.contains("modal-bd") && e.target.closest("[data-stop]")) return;
  const fn = DO[el.getAttribute("data-do")];
  if (fn) fn(el.getAttribute("data-v"), el);
});
root.addEventListener("input", (e) => {
  const el = e.target, path = el.getAttribute("data-in");
  if (!path || el.tagName === "SELECT") return;
  setPath(path, el.value);
  if (path === "panduanCari" || path === "knCari") return render();
  if (!el.getAttribute("data-live")) return;
  const hint = root.querySelector('[data-hint="' + path.split(".")[1] + '"]');
  if (!hint) return;
  if (path === "daftar.userId") {
    const bad = el.value && !KODE_RE.test(normKode(el.value));
    hint.textContent = bad ? "Huruf, angka, spasi, titik, - _ + saja." : "Persis seperti Kode SF-mu.";
    hint.style.color = bad ? "var(--bad)" : "";
  }
});
root.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const path = e.target.getAttribute && e.target.getAttribute("data-in");
  if (path === "masuk.id" || path === "masuk.username") DO.masuk();
  if (path === "admLogin.pass") DO.admMasuk();
  if (path === "fPetugas.q") DO.cariPetugas();
});
root.addEventListener("change", async (e) => {
  const el = e.target;

  const grpId = el.getAttribute("data-grup");
  if (grpId) {
    const baris = P.rows.find((r) => r.id === grpId);
    const lama = baris ? baris.group : "";
    if (!confirm("Ubah group " + grpId + (lama ? " dari " + lama : "") + " ke " + el.value + "?\nPoin group ikut dipindah, total poin & saldo tidak berubah.")) {
      if (lama) el.value = lama;
      return;
    }
    try {
      const hasil = await ubahGroupPetugas(grpId, el.value);
      if (hasil && baris) Object.assign(baris, hasil);
      toast("ok", hasil ? "Group diubah ke " + el.value + "." : "Group sudah " + el.value + ".");
      DO.detailPetugas(grpId);
    } catch (err) { toast("no", pesanGagal(err, "Gagal ubah group")); }
    return;
  }

  const stId = el.getAttribute("data-status");
  if (stId) {
    try { await updateDoc(doc(db, "petugas", stId), { status: el.value }); toast("ok", "Status diperbarui."); }
    catch (err) { toast("no", pesanGagal(err, "Gagal")); }
    return;
  }

  const umumJenis = el.getAttribute("data-umum");
  if (umumJenis && el.files && el.files[0]) {
    const file = el.files[0];
    S.impUmum = Object.assign(kosongUmum(), { jenis: umumJenis, namaFile: file.name });
    render();
    try {
      const { data } = await bacaFileSoal(file);
      const r = umumJenis === "knowledge" ? siapkanKnowledge(data) : umumJenis === "hadiah" ? siapkanHadiah(data) : umumJenis === "wilayah" ? siapkanWilayah(data) : umumJenis === "panduan" ? siapkanPanduan(data) : umumJenis === "group" ? siapkanGroup(data) : siapkanAdjustment(data);
      S.impUmum.valid = r.valid; S.impUmum.salah = r.salah;
      if (!r.valid.length && !r.salah.length) toast("no", "Tidak ada baris terbaca. Periksa nama kolom di baris pertama.");
    } catch (err) {
      S.impUmum = kosongUmum();
      toast("no", pesanGagal(err, "Gagal membaca file"));
    }
    el.value = "";
    render();
    return;
  }

  const soalKey = el.getAttribute("data-soal");
  if (soalKey && el.files && el.files[0]) {
    const file = el.files[0], tipe = soalKey.split(":")[0];
    S.impSoal = { key: soalKey, namaFile: file.name, valid: [], salah: [], busy: false };
    render();
    try {
      const { data } = await bacaFileSoal(file);
      const r = siapkanSoal(data, tipe);
      S.impSoal.valid = r.valid; S.impSoal.salah = r.salah;
      if (!r.valid.length && !r.salah.length) toast("no", "Tidak ada baris terbaca. Pastikan ada kolom pertanyaan dan opsi1-opsi4.");
    } catch (err) {
      S.impSoal = { key: "", namaFile: "", valid: [], salah: [], busy: false };
      toast("no", pesanGagal(err, "Gagal membaca file"));
    }
    el.value = "";
    render();
    return;
  }

  if (el.getAttribute("data-import") && el.files && el.files[0]) {
    const file = el.files[0];
    S.imp = Object.assign(S.imp, { namaFile: file.name, sheet: "", valid: [], salah: [], log: ["Membaca file…"], hasil: null });
    render();
    try {
      const { sheet, data } = await bacaFileImport(file);
      const { valid, salah } = siapkanImport(data, S.imp.group);
      S.imp = Object.assign(S.imp, { sheet, raw: data, valid, salah, log: [] });
    } catch (err) { S.imp.log = ["Gagal membaca file: " + (err.message || err)]; }
    el.value = "";
    return render();
  }

  const path = el.getAttribute("data-in");
  if (path && el.tagName === "SELECT") {
    setPath(path, el.value);
    if (path === "daftar.area") { S.daftar.regional = ""; S.daftar.branch = ""; S.daftar.cluster = ""; }
    if (path === "daftar.regional") { S.daftar.branch = ""; S.daftar.cluster = ""; }
    if (path === "daftar.branch") S.daftar.cluster = "";
    if (/^draftModul\.\w+\.area$/.test(path)) setPath(path.replace(/area$/, "regional"), "");
    if (path === "draftKn.area") S.draftKn.regional = "";
    if (path === "fPetugas.area") { S.fPetugas.regional = ""; S.fPetugas.branch = ""; S.fPetugas.cluster = ""; }
    if (path === "fPetugas.regional") { S.fPetugas.branch = ""; S.fPetugas.cluster = ""; }
    if (path === "fPetugas.branch") S.fPetugas.cluster = "";
    if (/^fPetugas\.(group|status|area|regional|branch|cluster)$/.test(path)) { S.fPetugas.q = ""; loadPetugasPage(true); }
    if (path === "imp.group" && S.imp.raw) { const r = siapkanImport(S.imp.raw, S.imp.group); S.imp.valid = r.valid; S.imp.salah = r.salah; }
    if (path === "lbWilayah.area") { S.lbWilayah.regional = ""; if (S.lbWilayah.area) muatRingkasanWilayah("area", S.lbWilayah.area); }
    if (path === "lbWilayah.regional" && S.lbWilayah.regional) muatRingkasanWilayah("regional", S.lbWilayah.regional);
    if (/^editOrg\./.test(path) && S.editOrg) {
      if (path === "editOrg.area") { S.editOrg.regional = ""; S.editOrg.branch = ""; }
      if (path === "editOrg.regional") S.editOrg.branch = "";
      S.modal = modalOrganik(S.orgModal);
    }
    return render();
  }

  const ans = el.getAttribute("data-ans");
  if (ans && S.run) { S.run.jawaban[ans] = parseInt(el.value, 10); render(); }
});

/* ============ boot ============ */
async function cekAdmin(user) {
  S.adminCek = false; render();
  try { S.adminOk = (await getDoc(doc(db, "admins", user.uid))).exists(); }
  catch (e) { S.adminOk = false; }
  S.adminCek = true;
  render();
  if (S.adminOk) { subscribeAdminKatalog(); loadWilayah(); onAdmMenu(S.adminMenu); }
}

onAuthStateChanged(auth, (u) => {
  /* identitas anonim milik perangkat petugas tidak pernah dianggap calon admin */
  const user = u && !u.isAnonymous ? u : null;
  if (user) { S.adminUser = user; S.mode = "admin"; cekAdmin(user); return; }
  if (S.mode === "admin") {
    stop("admin"); stop("redeem");
    S.adminUser = null; S.adminOk = false; S.adminCek = false;
    S.mode = "petugas";
    S.view = S.organikProfil ? "organikApp" : S.me ? "app" : "masuk";
    render();
  }
});

(async function mulai() {
  render();
  const sesi = await sesiPerangkat();
  if (S.mode === "admin") return;
  if (sesi && sesi.tipe === "organik") mulaiSesiOrganik(sesi.email);
  else if (sesi && sesi.tipe === "petugas") mulaiSesi(sesi.userId);
  else {
    /* Datang dari gerbang /updatepetugas: ?id=KODE mengisi kolom Kode SF otomatis */
    try { const q = new URLSearchParams(location.search).get("id"); if (q) S.masuk.id = normKode(q); } catch (e) {}
    S.view = "masuk"; render();
  }
})();
</script>
